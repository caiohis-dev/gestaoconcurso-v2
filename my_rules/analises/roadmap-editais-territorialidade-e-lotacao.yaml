       puser o índice um dia, aquele caso avisa.

    ➕ `lerColagemDoAnexo` NASCEU DENTRO DO COMPONENTE e foi movida para a lib no mesmo
       passe: o lint acusou `react-refresh/only-export-components` (112, de 111). A saída
       deste repo é EXTRAIR, nunca elevar o baseline — e a função ficou testável de
       quebra, com 8 casos próprios.

    ➕ O CAMPO `pronto` DE `QUADRO_FONTES` FOI REMOVIDO. Ele marcava fonte cujo capítulo
       ainda não existia; com a fatia 7 as cinco passaram a ter, e ele virou constante
       `true`. Flag que nunca é falsa é flag em que alguém confia sem motivo.

    🔴 UM CASO DE TESTE MUDOU DUAS VEZES EM DOIS DIAS, e as duas por motivo legítimo.
       `ArtigosDoCapitulo.ui.test.tsx` afirmava que `titulos` era fonte PENDENTE; a fatia 6
       a tornou pronta e ele caiu, foi reapontado para `vagas_por_area` com a anotação de
       que cairia de novo aqui — e caiu. Agora guarda o que SOBREVIVE das duas versões: a
       linha do artigo diz de ONDE a tabela vem. É armadilha 8 acontecendo à vista.

    ⚠️ INCOERÊNCIA NO PRÓPRIO EDITAL 004, registrada e não "corrigida": o ACE tem código
       "AE 4" no Quadro I e "AE 66" no Quadro III. Não é o sistema que erra — é o documento
       publicado. Fica como exemplo de por que o código de inscrição é texto livre.

    ⚠️ PERCALÇO DE FERRAMENTA, não de código: `npx supabase migration new` travou e ficou
