roadmap:
  titulo: "Editais fatia 7 — territorialidade e lotação (capítulo condicional)"
  criado: "2026-09-16"
  status: >
    ⏳ NÃO INICIADO — 🟡 ESBOÇO. Detalhar antes de executar: há uma decisão de ARQUITETURA
    em aberto (`unidades_lotacao` vs. `unidades_prova`) que precisa ser tomada primeiro.
  depende_de: "Fatia 1 (capítulo condicional) e fatia 2 (a distribuição de vagas por unidade)."

  origem: >
    O capítulo [5] (distribuição geográfica) e o Anexo II (delimitação rua a rua).
    Passo 4 do `UI e UX.md`, seção 3 do `Arquitetura de Tabelas…`.

  # ═══════════════════════════════════════════════════════════════════════════
  decisoes_do_usuario: |
    D_ORTOGONAL. 🔴 LIGÁVEL EM QUALQUER EDITAL.
        RECUSADO, e estava escrito em DOIS arquivos: o `UI e UX.md` intitulava o passo
        "(Condicional: ACS)" e o `Arquitetura de Tabelas…` chamava a seção de
        "(Exclusivo ACS/Polos)". O ACS é o caso conhecido, não uma condição.

  # ═══════════════════════════════════════════════════════════════════════════
  a_decidir_antes_de_codificar: |
    🔴 P1. `unidades_lotacao` VERSUS `unidades_prova`.
        `unidades_prova` JÁ EXISTE — é o catálogo de locais de APLICAÇÃO DE PROVA, com
        `sala_prova` pendurada e 12 linhas em produção. A proposta cria `unidades_lotacao`
        para locais de TRABALHO (UBS/UBSF).

        São conceitos diferentes que podem apontar para os MESMOS prédios. Reaproveitar,
        relacionar ou separar é decisão consciente — e o porquê tem de ficar registrado.
        ⚠️ O que não pode é nascerem dois catálogos de unidade sem ninguém notar; é o tipo
        de duplicação que só dói seis meses depois, quando alguém renomear uma unidade num
        só dos dois.

  # ═══════════════════════════════════════════════════════════════════════════
  medido_antes: |
    🔴 O ANEXO I DO EDITAL 004 TEM 963 LINHAS DE TABELA (medido no arquivo em 16/09).
       O teto do PostgREST é 1.000 linhas, e ele CORTA SEM ERRO NENHUM.

       Isso já mordeu este repo duas vezes — a listagem de colaboradores (771 linhas, 77%
       do teto) e o painel de dados. O sintoma aqui seria uma RUA SUMINDO do anexo publicado,
       sem sinal na tela.

       Consequência obrigatória: qualquer leitura de `territorialidade_abrangencia` nasce
       com `.range()` ou busca no servidor. NUNCA um select solto confiando que cabe.

  # ═══════════════════════════════════════════════════════════════════════════
