  riscos: |
    R1. 🔴 **O teto de 1.000 do PostgREST.** 963 linhas hoje; o próximo edital passa. E o
        corte é silencioso. Esta é a fatia com maior risco de perda silenciosa de todo o
        módulo.

    R2. **Dois catálogos de unidade** (P1). Se a decisão for adiada "por enquanto", ela será
        tomada por omissão — e a favor da duplicação.

    R3. **A regra de residência é jurídica, não de sistema.** "Residir na área desde a
        publicação do edital" é condição que a banca confere na posse. ⚠️ O sistema descreve
        a regra no texto; não a valida. Registrar, ou alguém vai supor validação que não existe.

  # ═══════════════════════════════════════════════════════════════════════════
  medido_na_etapa_0: |
    🔴 O QUADRO II DO EDITAL 004 TEM A MESMA FORMA DO QUADRO I — e isso muda o desenho.

      | UNIDADE BÁSICA DE SAÚDE | Código da Inscrição | VAGAS AC | VAGAS PD | VAGAS CN |
      | UBSF Belmonte           | DN-3                | 3        |          | 1        |

    São 39 linhas, 80 vagas de ACS distribuídas. Cada unidade tem **código de inscrição
    próprio** (DN-1 a DN-39) e o **mesmo trio AC/PD/CN** do Quadro I. Ou seja: para o ACS,
    a opção de inscrição É a unidade, e a cota é calculada POR UNIDADE.

    Consequência para o modelo: a distribuição é um nível ABAIXO do cargo, como
    `provas_disciplinas` e `titulos_itens` — uma tabela com FK para `edital_cargos` e para
    a unidade, carregando `codigo_inscricao` e os três números.

    ⚠️ E NÃO pode ser `edital_cargos` com uma linha por unidade: existe
    `UNIQUE (edital_id, cargo_id)`, então o ACS só cabe uma vez ali. Confirmado no banco.

