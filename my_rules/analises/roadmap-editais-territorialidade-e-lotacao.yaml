  medido_antes: |
    🔴 O TETO DO POSTGREST CONTINUA SENDO O RISCO CENTRAL. 843 logradouros num edital só,
       84% do `max_rows` de 1000 — e ele CORTA SEM ERRO NENHUM. Já mordeu este repo duas
       vezes (colaboradores, 771 linhas, 77%; e o painel de dados). O sintoma aqui seria
       uma RUA SUMINDO do anexo publicado, sem sinal na tela.

       Consequência obrigatória, e cumprida: a leitura passa por `buscar-em-fatias`, com
       ordem estável (`ordem`, depois `id`). NUNCA um select solto confiando que cabe.

    🔴 ⚠️ DUAS PREMISSAS ESCRITAS AQUI ESTAVAM ERRADAS, e as duas eram do tipo que só cai
       quando alguém abre o documento. Ficam registradas, não apagadas:

       1. "O ANEXO II do 004 tem 963 linhas de ruas". ERRADO NAS DUAS PONTAS.
          · No Edital 004 as ruas estão no **ANEXO I**; o Anexo II é conteúdo
            programático. É o INVERSO do 002 e do 003, onde o Anexo I é o conteúdo — e foi
            justamente essa inversão que produziu o engano.
          · São **843** logradouros, não 963.

       2. "`numero_inicial`, `numero_final`". NÃO EXISTEM. O Anexo I lista nome de
          logradouro e nada mais. Das 843 linhas, 104 têm algo que PARECE faixa, e cada
          uma é de um tipo diferente:

            TRAV. VISCONDE DO RIO BRANCO (ALAMEDAS 1 A 7)       alamedas, não porta
            RODOVIA LÚCIO MEIRA KM 7501 A 8500                  quilometragem
            RUA VEREADOR ACACIO DA ROCHA (DO N 03 ATÉ O N 9201) aí sim, número de porta
            RUA 1, 2, 3 e 4 (CONDOMÍNIO VISTA BELA)             quatro ruas numa linha
            RUA 552                                             só o nome da rua

          ➜ `logradouro` é TEXT e guarda o publicado. É a mesma decisão de 01/08 ("dado
            inválido entra cru; valide na leitura"), que removeu 4 CHECKs de formato.

    ⚠️ A ESTRUTURA DO ANEXO I É IRREGULAR, e o modelo teve de acomodar isso: das 28 seções,
       12 listam as ruas DIRETO sob a unidade e as outras desdobram por bairro. Por isso
       `bairro` é anulável, e `agruparPorBairro` mantém a seção nula ONDE ela apareceu.

    ⚠️ E A COBERTURA É PARCIAL: 39 unidades no Quadro II, **14** com lista publicada no
       Anexo I. A tela diz isso na cara — ausência que não se explica parece carregamento
       pela metade.

