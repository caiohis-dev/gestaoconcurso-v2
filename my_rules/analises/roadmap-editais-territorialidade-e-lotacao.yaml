        - "Bateria SQL · npm test · tsc · lint (baseline 111) · build · docs:conferir"

  # ═══════════════════════════════════════════════════════════════════════════
  riscos: |
    R1. 🔴 **O teto de 1.000 do PostgREST.** 963 linhas hoje; o próximo edital passa. E o
        corte é silencioso. Esta é a fatia com maior risco de perda silenciosa de todo o
        módulo.

    R2. **Dois catálogos de unidade** (P1). Se a decisão for adiada "por enquanto", ela será
        tomada por omissão — e a favor da duplicação.

    R3. **A regra de residência é jurídica, não de sistema.** "Residir na área desde a
        publicação do edital" é condição que a banca confere na posse. ⚠️ O sistema descreve
        a regra no texto; não a valida. Registrar, ou alguém vai supor validação que não existe.
