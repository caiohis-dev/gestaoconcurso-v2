  achado_que_mudou_outra_fatia: |
    🔴 A MEDIÇÃO DO QUADRO II CORRIGIU A REGRA DE COTAS DA FATIA 2, e vale registrar como
    o erro sobreviveu: ele não era um descuido, era um caso que o dado antigo não podia
    decidir.

    A regra saiu de 22 valores dos Editais 002 e 003 e estava certa para os 22. Mas
    **nenhum cargo daqueles dois editais tem 3 vagas** — conferido um a um. O Quadro II
    trouxe 39 valores novos, com 5 totais distintos, inclusive o 3:

      total=1  20 unidades  (1,0,0)  ✅ igual ao arredondamento comum
      total=2   7 unidades  (2,0,0)  ✅
      total=3   4 unidades  (3,0,0)  🔴 o arredondamento dava (2,0,1)
      total=4   7 unidades  (3,0,1)  ✅
      total=6   1 unidade   (4,1,1)  ✅

    As 4 unidades de 3 vagas concordam ENTRE SI, então é regra da FEVRE e não erro de
    digitação do edital. Entrou `MINIMO_DE_VAGAS_PARA_COTA_RACIAL = 4` em
    `src/lib/edital-cotas.ts`, com o Quadro II inteiro como controle positivo novo.

    ⚠️ É prática MEDIDA, não a Lei 12.990/2014 — que manda reservar a partir de 3 vagas.
    A divergência fica registrada; se uma norma passar a valer, muda a constante e os 61
    valores acusam a diferença.

    🔴 E o efeito prático era real: antes disso, um cargo de 3 vagas recebia a sugestão
    (2 AC, 0 PD, 1 CN) — um split que a FEVRE nunca publicou. Nenhum dos 31 testes de
    cotas cobria o caso, o que é o próprio sintoma: dado que não existe não vira teste.

  # ═══════════════════════════════════════════════════════════════════════════
  o_quadro_i_do_004_nao_tem_vagas: |
    🔴 ACHADO QUE MUDOU O QUE DÁ PARA VALIDAR. O Quadro I do Edital 004 publica só
    "DO CARGO, HABILITAÇÃO, CARGA HORÁRIA E VENCIMENTOS" — **sem coluna de vagas**. O item
    2.2 manda ao Quadro II. Compare com o 002, cujo Quadro I é "DOS CARGOS, N.º DE VAGAS,
    HABILITAÇÃO…".

    Então, num edital territorializado, o total do cargo é DERIVADO da distribuição: não
    existe número declarado para conferir contra. `conferirDistribuicao` só acusa
    divergência quando os DOIS existem — cobrar a igualdade contra um `null` acusaria todo
    edital do tipo 004.

    E os dois cargos do 004 provam que a territorialização é do CARGO, não do edital:

      ACS  — Quadro II ....  80 vagas em 39 UBSF, cota calculada em cada uma
      ACE  — Quadro III ... 143 vagas numa linha só, sem unidade nenhuma

    ⚠️ A regra de cotas bate EXATA nas 143 do ACE (100 AC / 14 PD / 29 CN), o que a
    confirma num total grande — os outros controles eram todos de cargos pequenos.

  # ═══════════════════════════════════════════════════════════════════════════
  desvios_da_execucao: |
