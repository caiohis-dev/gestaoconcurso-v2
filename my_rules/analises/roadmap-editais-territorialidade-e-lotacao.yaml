  p1_respondida: |
    ✅ DECIDIDO em 2026-09-17: **TABELAS SEPARADAS**, e a decisão saiu da medição, não do
    gosto. A pergunta supunha que os dois catálogos "podem apontar para os MESMOS
    prédios" — e no dado real isso é FALSO.

      `unidades_prova`, 12 linhas em produção, TODAS locais de aplicação de prova:
        CENTRO UNIV. GERALDO DI BIASE · COLÉGIO GETÚLIO VARGAS · COLÉGIO JOÃO XXIII ·
        COLÉGIO PROF. DELCE H. DELGADO · ESC. DE ENG. IND. METALÚRGICA ·
        I. E. PROFESSOR MANUEL MARINHO · INSTITUTO DE CULTURA TÉCNICA ·
        PROFª GLÓRIA ROUSSIM G. PINTO · SEDE ADMINISTRATIVA · UGB Blocos II, III e IV

      Quadro II do Edital 004, 39 linhas, TODAS unidades de saúde:
        UBSF Açude I · UBSF Belmonte · UBS Caieiras · UBSF Eucaliptal · … (39)

      🔴 INTERSEÇÃO: ZERO. Escolas e faculdade de um lado, UBS e UBSF do outro.

    Os três motivos, em ordem de peso:

      1. **Zero sobreposição medida.** Reaproveitar resolveria uma duplicação que não
         existe, e cobraria o preço em todo lugar.
      2. **`unidades_prova` tem só `unid_nome` e `unid_sigla`** — nem endereço tem. Uma
         unidade de LOTAÇÃO precisa de endereço e de abrangência territorial. Acrescentar
         essas colunas lá deixaria 12 linhas com tudo nulo para sempre.
      3. **`sala_prova` pende de `unidades_prova`** — salas, capacidade, andares. Nada
         disso significa coisa alguma para uma UBSF, e um discriminador `tipo` obrigaria
         toda consulta das duas famílias a filtrar, para sempre, sob pena de misturar.

    ⚠️ O QUE FICA REGISTRADO CONTRA O RISCO ORIGINAL: se um dia um prédio servir às duas
    coisas, ele será DUAS linhas, uma em cada catálogo. É aceito, e é mais barato que o
    discriminador — mas quem renomear terá de renomear nos dois. O risco não sumiu;
    ele encolheu para um caso que hoje não ocorre nenhuma vez.

