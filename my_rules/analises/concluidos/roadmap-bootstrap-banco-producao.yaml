# Roadmap — bootstrap do banco de produção da v2 no supabase.com
# Criado em 2026-08-06, executado em 2026-08-08, CONCLUÍDO em 2026-08-10 e arquivado
# em concluidos/ no mesmo dia. Este arquivo é o registro do desenho, das medições e das
# decisões — não um plano vivo.
# O roteiro estável (as regras que valem SEMPRE) mora em my_rules/banco-producao.md.
#
# ⚠️ O QUE NÃO SE FECHOU JUNTO, e segue no backlog.md: o achado A2 (o `.env` da raiz se
#    chama produção e aponta para o Docker local) e a subida do frontend, que tem roteiro
#    próprio em my_rules/hospedagem-e-deploy.md.

roadmap:
  titulo: "Subir a base para um projeto novo no supabase.com (só o banco)"
  criado: "2026-08-06"
  status: >
    🟢 **CONCLUÍDO em 2026-08-10.** O banco de produção da v2 está de pé e **provado por
    login real** em `zugigdpuxbpogoepdawm`: schema (122 migrations), dados (controle
    positivo 12/12), 8 edge functions com secrets, auth parametrizado no dashboard.
    As 9 etapas (0 a 8) fecharam.
    ✅ **O repo está DESARMADO** — `prod:unlink` rodou ao fim da execução de 08/08 e
    `supabase/.temp/` não existe. Relinkar, quando for o caso, é
    `npx supabase link --project-ref zugigdpuxbpogoepdawm`.
    Linha do tempo: desenho aprovado em 2026-08-06 (D1, D2); revisado em 2026-08-08 com o
    PLANO GRATUITO e o projeto novo (D3, D4), quando também foi reconciliada a divergência
    do `.env` contra `hospedagem-e-deploy.md`, e **executado tecnicamente no mesmo dia**;
    fechado em 2026-08-10 quando o usuário parametrizou o Auth e o login real passou.
    ⭐ O bootstrap NÃO ficou "verde sem prova" — que era o risco R5.

  origem: >
    Pedido do usuário em 2026-08-06: "subir a base do supabase para uma base nova em
    supabase.com". O alvo final é ter o código local desenvolvendo contra o banco local e
    a v2 em produção apontando para o banco na nuvem — mas ele pediu para **cuidar
    primeiro do banco**, deixando frontend e domínio para um segundo momento.

  # ═══════════════════════════════════════════════════════════════════════════
  decisoes_do_usuario: |
    D1. ESCOPO = SÓ O BANCO HOJE. Entra: criar o projeto, subir as migrations, carregar os
        dados, configurar o auth no dashboard, publicar as edge functions com os secrets.
        Fica para depois: host, domínio, `site_url` definitivo, merge `dev`→`main` e tag.
        `main` continua CONGELADA em v1.0.0.
        ⚠️ Consequência aceita: sem domínio, o `site_url` e o `SITE_URL` das functions ficam
        provisórios — e **fluxo de e-mail não deve ser disparado em produção** até o
        frontend subir, porque o link iria para o lugar errado.

    D2. DADOS = DUMP COMPLETO. Carrega `public.*` + `auth.users` + `auth.identities` do
        `supabase/seed.local.sql`. É a opção de continuidade: os hashes de senha viajam e
        os logins de produção continuam valendo.

        🔵 **CORRIGIDO em 2026-08-06, no mesmo dia:** ao perguntar sobre os dados, eu
        afirmei que os 2 editais do banco local eram **playground criado à mão** e não
        subiriam. **Está errado, e o `db reset` provou:** eles sobrevivem ao reset porque
        `seed.pos.sql` — que é VERSIONADO e é passo do bootstrap (etapa 3) — os **deriva
        das 2 provas do dump** (`INSERT INTO editais ... SELECT DISTINCT ON
        (lower(btrim(p.prova_edital)))`). O dump realmente não tem `INSERT INTO
        public.editais`, e foi por isso que a medição por grep me enganou: o dado não é
        copiado, é **calculado**. Consequência prática: **a base nova nasce COM os 2
        editais**, sem nenhum passo extra — e não havia decisão a tomar aqui.

    D3. PLANO = GRATUITO (2026-08-08). O projeto de produção nasce no free tier. As cotas
        foram medidas contra o banco local e cabem com folga grande — ver a seção
        `plano_gratuito`. As duas lacunas do free (pausa por inatividade e ausência de
        backup) o usuário decidiu **documentar, não mitigar**: não viram passo de roteiro,
        viram os riscos R6 e R7.

    D5. REGIÃO = us-west-2 (Oregon), decidida na execução de 2026-08-08. O projeto foi
        criado nessa região, e não em `sa-east-1` como este roadmap pedia. Apresentei o
        custo — usuários no Brasil pagam ~180 ms de ida e volta contra ~15 ms de São Paulo,
        empilhados nas telas que fazem consultas em sequência (importação de candidatos,
        alocação por arrasto) — e o usuário optou por **seguir em us-west-2**.
        ⚠️ **Região não se muda:** reverter exige apagar o projeto e refazer o bootstrap.
        Era barato no momento da decisão (banco vazio) e deixou de ser depois da carga.
        Se a latência incomodar em uso real, o custo da migração é este roadmap inteiro
        de novo — mais o que produção já tiver acumulado de dado próprio.

    D4. PROJETO NOVO, não o de 12/07 (2026-08-08). O projeto criado em 2026-07-12 é
        descartado — nunca recebeu schema nem dado, e recriar permite escolher a região na
        hora. ⚠️ Isto muda a etapa 1: ela deixa de ser "criar ou confirmar" e passa a ter o
        passo de **apagar os projetos velhos**, porque o free admite só 2 ativos por
        organização e há dois candidatos a ocupar as vagas (o do Lovable,
        `dqslqfzqukcahogkieet`, e o de 12/07). Ver R8.
        ⚠️ Consequência no `backlog.md`: a frase "O projeto novo no supabase.com já foi
        criado" deixou de valer.

  # ═══════════════════════════════════════════════════════════════════════════
  medido_antes: |
    Medido em 2026-08-06, contra o disco e o banco local (não estimado);
    🔵 **remedido em 2026-08-08** onde marcado.

    · 🔵 **122 migrations** em `supabase/migrations/` (eram 121 em 06/08). ⚠️ Este número já
      envelheceu 4 vezes no backlog (69 → 85 → 106 → 121 → 122). **Confira com
      `ls supabase/migrations/*.sql | wc -l` no dia**, nunca com o número escrito aqui.
    · **8 edge functions** (`check-cpf-colaborador`, `corrigir-email-acesso`,
      `create-admin`, `create-coordenador`, `public-create-colaborador`, `recuperar-senha`,
      `reivindicar-acesso`, `send-email`). O 9º diretório é `_shared` e não é function.
      ⚠️ `banco-producao.md` e a memória diziam **6**.
    · **Repo deslinkado** — `supabase/.temp/` só tem `cli-latest`. **CLI sem login.**
    · Dump `supabase/seed.local.sql`: 1,3 MB, de 03/08, **já sem** `colab_codigo_acesso`,
      `sala_arcondicionado` e `unid_andares` (as três colunas dropadas) — 0 ocorrências.
    · `config.toml`: `major_version = 17`.
    · Nenhuma URL de projeto antiga hardcoded nas functions nem em
      `src/integrations/supabase/client.ts` (que lê `import.meta.env`).
    · Nenhum arquivo de ambiente versionado: `.gitignore` cobre `.env` e `.env.*`.

    NÚMEROS-ALVO (banco local hoje; são o CONTROLE POSITIVO do bootstrap — a nuvem tem de
    chegar nos mesmos depois da carga):

      colaboradores 771 · auth.users 15 · user_roles 41 · funcoes_colaboradores 18
      provas 2 · unidades_prova 11 · sala_prova 42 · salas_prova_distribuidas 58

    🔵 O QUE O DUMP REALMENTE LEVA (medido em 2026-08-08, contando os `INSERT INTO`):
    **2.079 linhas no total.** As maiores: `colaboradores` 771 · `colaboradores_prova` 554
    · `email_atualizacao_log` 232 · `meta_colaboradores_unidade` 186 ·
    `salas_prova_distribuidas` 58 · `sala_prova` 42 · `user_roles` 29 · `auth.users` 15 ·
    `auth.identities` 15.

    🔴 **Os 7.591 `candidatos` do banco local NÃO estão no dump** — não há nenhum
    `INSERT INTO public.candidatos` nele. São playground, importados por planilha depois que
    o dump foi tirado (a feature de importação é posterior). **Produção nasce sem candidato
    nenhum**, e eles entram pela importação, já com o sistema no ar. Isso é o esperado, não
    uma perda — mas muda o dimensionamento (ver `plano_gratuito`) e muda o que se espera ver
    na etapa 6: `/candidatos` legitimamente vazia.

    🔵 TAMANHO (medido em 2026-08-08 com `pg_database_size` contra o banco local):
    **26 MB** o banco INTEIRO, dos quais `public` 13 MB (`candidatos` sozinha = 10 MB),
    `auth` 1.192 kB e `storage` 272 kB. Como os candidatos não viajam, **a base de produção
    nasce com ~5 MB**.

