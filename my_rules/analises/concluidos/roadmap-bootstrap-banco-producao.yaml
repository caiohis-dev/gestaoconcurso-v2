  plano_gratuito: |
    Seção criada em 2026-08-08 com a D3. Cotas lidas em supabase.com/pricing e nas docs de
    auth no mesmo dia; os nossos números são medidos contra o banco local, não estimados.

    O QUE CABE FOLGADO — nenhum destes é preocupação, e a folga é grande o bastante para
    não voltar a ser pergunta:

    | Cota do free            | Limite   | Nosso número (medido 08/08)          | Folga   |
    |-------------------------|----------|--------------------------------------|---------|
    | Tamanho do banco        | 500 MB   | 26 MB o local; prod nasce com ~5 MB  | ~19×    |
    | Usuários ativos por mês | 50.000   | 15 em `auth.users`                   | ~3.300× |
    | Storage de arquivos     | 1 GB     | 0 — nenhum bucket, o app não usa     | —       |
    | Egress                  | 5 GB/mês | ~800 colaboradores + planilhas       | folgado |

    ⚠️ O crescimento também cabe: `candidatos` ocupa 10 MB para 7.591 linhas (~1,4 KB por
    linha). Mesmo com dez editais cheios do tamanho do atual, o teto de 500 MB não é
    alcançado. Se algum dia for, o sinal virá antes pela cota de egress.

    🔵 O LIMITE DE E-MAIL DO FREE **NÃO NOS ATINGE** — e isso não era óbvio.
    O SMTP embutido do Supabase é **2 mensagens por hora** e **só entrega para endereços de
    membros do time** do projeto. Para um sistema que convida centenas de fiscais por
    e-mail, isso seria fatal — e silencioso. Foi verificado no código que **nenhum fluxo
    depende dele**:

      · `_shared/enviar-link-acesso.ts:93` chama `auth.admin.generateLink`, que apenas GERA
        o link e **não envia nada**; o envio segue por `fetch` para a EF `send-email`, que
        fala com o SMTP da Hostinger. É o caminho de todo convite e de toda recuperação.
      · `create-admin` e `create-coordenador` usam `admin.createUser` com
        `email_confirm: true` — conta já confirmada, nenhum e-mail disparado.
      · `supabase.auth.signUp` (`src/hooks/useAuth.tsx:142`) é o único caminho nativo, e
        **nunca é chamado**: existe na interface do contexto e nos mocks de teste, e mais
        nada em `src/` o invoca.

    ⚠️ Mesmo assim, **cadastre o SMTP da Hostinger no dashboard** (etapa 4). É gratuito no
    free, usa as credenciais que já existem, e cobre os caminhos nativos que não passam pelo
    nosso código: convite disparado do próprio dashboard, e um `signUp` que volte a ser
    ligado. Sem isso, o limite volta a ser 2/hora só para endereços do time — e o erro
    aparece como e-mail que "não chega", sem nada no app denunciando.

    AS DUAS LACUNAS REAIS. O free **pausa o projeto após 1 semana de inatividade** e **não
    tem backup nenhum**. Decisão do usuário em 2026-08-08: **documentar, não mitigar** — não
    há passo de roteiro para elas. Estão em R6 e R7, e é lá que se lê o custo.

