    ─── Riscos do PLANO GRATUITO (D3, 2026-08-08). Decisão: documentar, não mitigar. ───

    R6. 🔴 **O free PAUSA o projeto após 1 semana de inatividade.** É a lacuna mais provável
        de doer, porque o perfil de uso deste sistema é exatamente o que a dispara: rajada
        intensa perto da prova, meses de silêncio depois. Projeto pausado = o site carrega,
        mostra o login e **falha em tudo** — o mesmo sintoma do bundle apontado para o
        lugar errado, o que torna o diagnóstico confuso.
        O despausar é manual, pelo dashboard, e leva alguns minutos.
        ⚠️ Duas consequências que não são óbvias: **acesso de leitura ao dashboard não conta
        como atividade** — o que conta é requisição ao projeto; e o intervalo entre a
        publicação do site e o primeiro uso real é justamente uma janela de silêncio.
        Se um dia virar problema, as saídas são um ping periódico ou o Pro (US$ 25/mês, que
        também remove a pausa). **Nenhuma das duas está no roteiro por decisão.**

    R7. 🔴 **O free NÃO tem backup.** Nem diário, nem PITR, nem download pelo dashboard —
        são do Pro. Isso inverte um princípio deste projeto: a etapa 3 declara que
        "produção passa a ser dona dos dados e o caminho local→prod se fecha para sempre",
        mas sem backup **não há nada de onde restaurar** se algo apagar dado em produção.
        O `seed.local.sql` cobre só o estado de 03/08: tudo que for cadastrado depois — os
        candidatos importados, as alocações, as salas — existe em um lugar só.
        ⚠️ E este é um banco onde `DELETE` em massa é operação normal de negócio: a
        importação de candidatos é **troca total** (apaga a lista do edital e reinsere).
        A saída, se um dia entrar no escopo, é `pg_dump` periódico contra a connection
        string — mas ⚠️ **um dump novo nasce sem as três correções manuais** do R2, então a
        rotina teria de ser desenhada, não improvisada no dia.

    R8. ⚠️ **O free admite 2 projetos ativos por organização.** Se o do Lovable e o de 12/07
        estiverem ambos de pé, a criação do projeto novo (etapa 1) é **recusada** — e o erro
        chega no meio do roteiro, não antes. Por isso a limpeza virou o primeiro item da
        etapa 1, e não uma nota.
        🔴 Antes de apagar o projeto do Lovable, confirmar que `supabase/seed.local.sql`
        abre e tem as 2.079 linhas: ele **não é versionado**, e depois de apagado o projeto
        é a única cópia dos dados de 771 colaboradores com PII real.
