  achados_que_mudam_o_roteiro: |
    🔴 A1. **`SITE_URL` é secret obrigatório e NÃO está no roteiro.**
        `supabase/functions/_shared/enviar-link-acesso.ts:91` faz
        `Deno.env.get('SITE_URL') ?? 'http://127.0.0.1:8080'` e usa isso em
        `redirectTo: ${siteUrl}/redefinir-senha`. O passo 7 do `banco-producao.md` só manda
        cadastrar os quatro `SMTP_*`. Sem `SITE_URL` em produção, **todo convite e toda
        recuperação de senha nascem apontando para localhost** — e o `??` engole o erro.
        É perda silenciosa (§8 do CLAUDE.md). Corrigir o doc na etapa 8.
        (`JWT_SECRET` aparece só em `_shared/test-utils.ts` — não é secret de produção.
        `SUPABASE_URL`, `SUPABASE_ANON_KEY` e `SUPABASE_SERVICE_ROLE_KEY` são injetados
        pela plataforma e NÃO devem ser cadastrados.)

    🔴 A2. **O `.env` da raiz mente.** Ele se chama "produção" e contém
        `VITE_SUPABASE_URL="http://127.0.0.1:54321"` com a publishable key LOCAL. Como o
        Vite embute `VITE_*` em tempo de BUILD, `npm run build` nesta máquina hoje gera um
        bundle de produção apontando para localhost — **sem erro no build**, quebrando só
        no navegador do usuário. É a armadilha nº 1 do §8: o nome mente antes do código.

    ⚠️ A3. **Ordem de precedência do Vite, verificada no código** (5.4.19,
        `getEnvFilesForMode`): `.env` → `.env.local` → `.env.[mode]` → `.env.[mode].local`,
        **o último vence**. Reconferido na fonte em 2026-08-08
        (`node_modules/vite/dist/node/chunks/dep-C6uTJdX2.js:34884`) — a ordem está certa.

        🔵 **CORRIGIDA em 2026-08-08 a CONCLUSÃO, não a medição.** Este achado dizia que
        `.env.production.local` "é o arquivo certo", e a etapa 6 mandava criá-lo e
        **apagá-lo** depois. Da própria ordem acima decorre que **`.env.production` já vence
        o `.env.local`** — o sufixo `.local` é desnecessário. E o arquivo **não** deve ser
        apagado: [`../../hospedagem-e-deploy.md`](../../hospedagem-e-deploy.md), escrito em 08/08,
        o define como o arquivo PERMANENTE de todo deploy (`.gitignore` cobre `.env.*`), e o
        gate do `deploy.sh` conta com ele. Apagá-lo faria o próximo build voltar a sair
        apontando para o Docker local — exatamente o defeito que o A2 descreve.
        **Vale o `.env.production`.** Duas docs vivas recomendando arquivos diferentes é o
        tipo de divergência que só aparece no dia do deploy.

    ✅ A4. **RESOLVIDO em 2026-08-08 — a nuvem ACEITA.** A dúvida era se
        `SET session_replication_role = replica` (que o dump usa para desligar os triggers
        durante a carga) seria recusado, já que o role `postgres` do Supabase hospedado não
        é superusuário. O checkpoint em transação passou: `SET` → `SHOW` devolveu `replica`.
        A carga rodou sem nenhum tratamento especial.
        ⭐ **A prova real veio depois, no controle positivo:** `profiles` terminou com **15**
        linhas, não 30. Se o `SET` não tivesse pegado, o trigger `on_auth_user_created`
        teria criado um `profiles`/`user_roles` a mais para cada um dos 15 `auth.users`
        inseridos. É a contagem que separa "carregou" de "carregou certo".

