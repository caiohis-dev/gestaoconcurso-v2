    - id: 5
      titulo: "⭐ A chave natural passa a usar `cargo_id`"
      janela: "C"
      status: |
        ✅ CONCLUÍDA em 2026-07-28 — migration `20260728100000_candidatos_chave_cargo_id.sql`.

        PRÉ-CHECK MEDIDO NA HORA (não presumido da anotação de 27/07): candidatos 0 linhas,
        0 com cargo_id nulo; cargos 0; cargo_apelidos 0. Logo não havia o que preencher nem
        o que fundir, e a medição da fusão legítima ficou vacuosa.

        ⚠️ O backfill e a guarda FICARAM na migration mesmo assim, porque ela vai rodar
        noutros bancos (produção no dia do deploy). E a GUARDA FICOU MAIS PRECISA do que o
        desenho pedia: o roadmap mandava levantar erro se restasse qualquer cargo_id NULL,
        mas NULL sozinho não é problema — o problema é COLISÃO. A guarda conta os grupos
        colidentes com GROUP BY (que agrupa NULLs juntos, a mesma semântica de NULLS NOT
        DISTINCT), o que cobre aquele caso E qualquer outro, sem falhar à toa quando existe
        UMA linha sem cargo, que o índice aceitaria numa boa.

        ⭐ A ORDEM DO PIPELINE DEIXOU DE DEPENDER DE DISCIPLINA. `deduplicar()` passou a
        aceitar só `LinhaResolvida[]`, que só sai de `resolverLinhas()`. Verificado por
        sabotagem: voltar a `deduplicar(convertidas)` dá TS2345 — erro de compilação, não
        defeito silencioso. É o mesmo padrão de `CandidatoResolvido` da etapa 2.

        Duas consequências na TELA que o desenho previu e que precisaram de texto novo:
        - O passo 2 não pode mais anunciar o número final (sem cargo resolvido todos os
          cargo_id são null e as inscrições da mesma pessoa colapsariam — anunciaria 396 a
          menos). Passou a mostrar "N linha(s) lida(s)", e o número real é afirmado no
          passo 3. O teste ⭐⭐ da colisão foi REESCRITO para ler no passo 3, já resolvido:
          trocar só a string teria enfraquecido em silêncio o teste mais importante do
          módulo, porque o badge do passo 2 não passa mais pelo dedup.
        - `repetidas` mudou de significado e o aviso mudou de lugar (passo 2 → passo 3),
          dizendo explicitamente "o mesmo cargo DEPOIS DA ASSOCIAÇÃO".

        VERIFICADO PELO POSTGREST (não só por SQL): idempotência 3→3→3, controle positivo
        de UPDATE, linha sem CPF segue 1, e renomear o cargo mantém 3 com o nome novo no
        join. O controle positivo é o que prova que o índice está sendo INFERIDO.
      objetivo: >
        Fechar o problema que abriu a revisão de 27/07: tornar a identidade do candidato
        independente do texto. Só depois que a etapa 4 garante cargo_id preenchido.
      pre_requisito: "Etapa 4 concluída e verificada. Sem ela, todos os cargo_id são NULL."
      acoes:
        - acao: "PRÉ-CHECK do dado existente — a migration pode ser IMPOSSÍVEL de aplicar"
          detalhe: |
            ⚠️ Descoberto na revisão de 27/07, e é o risco mais sério da etapa: com
            NULLS NOT DISTINCT, linhas existentes com cargo_id NULL COLIDEM ENTRE SI —
            a mesma pessoa em dois cargos (382 casos no arquivo real) tem cpf e inscrição
            iguais, e com os dois cargo_id NULL o CREATE UNIQUE INDEX simplesmente FALHA.
            Não é fusão silenciosa: é migration que não aplica.

            Antes de escrever a migration, medir no banco alvo:
              SELECT count(*) FROM candidatos WHERE cargo_id IS NULL;
            - 0 linhas (tabela vazia ou tudo importado pós-etapa-4): seguir direto.
              Estado local em 27/07: tabela VAZIA — mas conferir na hora, não confiar.
            - >0: preencher ANTES, dentro da própria migration, com o UPDATE
              determinístico a partir dos apelidos:
                UPDATE candidatos c SET cargo_id = a.cargo_id
                FROM cargo_apelidos a
                WHERE c.cargo_id IS NULL
                  AND a.texto_chave = lower(btrim(coalesce(c.cargo,'')));
              e em seguida um DO $$ ... $$ que LEVANTA ERRO com contagem se restar NULL —
              melhor a migration falhar com mensagem nossa do que com 'duplicate key'.
            ⚠️ Sobre a regra "dado não vai em migration": ela separa schema de carga; este
            UPDATE é regra genérica idempotente derivada do próprio banco, sem dado
            inventado, e PRECISA rodar entre dois comandos de schema da mesma migration
            (antes do índice, depois de nada) — seed.pos não alcança esse ponto. Registrar
            o porquê no cabeçalho da migration, citando esta seção.
        - acao: "MEDIR a fusão legítima (regra 5 de invariantes)"
          detalhe: |
            Contar, contra o mapeamento real que o usuário fez:
              (edital, cpf, cargo_id, inscrição) distintos  =?  linhas
            Diferença = pessoas fundidas por dois textos → mesmo cargo. Fundir é correto
            quando o mapeamento diz que é o mesmo cargo; olhar QUAIS antes de seguir.
        - acao: "Migration NOVA (a troca em si)"
          detalhe: |
            - (o pré-check/backfill acima, se necessário)
            - DROP INDEX candidatos_cpf_cargo_inscricao_key
            - CREATE UNIQUE INDEX candidatos_cpf_cargo_id_inscricao_key
                ON candidatos (edital_id, cpf, cargo_id, n_inscricao) NULLS NOT DISTINCT
            - ALTER TABLE candidatos DROP COLUMN cargo_chave   (D3)
            - COMMENT no índice, apontando para este roadmap
            ⚠️ NULLS NOT DISTINCT continua obrigatório pelos 2 CPFs impossíveis (viram
            NULL e se reinseririam a cada reimportação sem a cláusula).
        - acao: "As QUATRO coisas que têm de concordar (eram três; o dedup entrou)"
          detalhe: |
            Mexeu numa, mexe nas quatro — senão o bloco de 500 falha inteiro:
            - o índice (acima)
            - useCandidatos.tsx: onConflict → "edital_id,cpf,cargo_id,n_inscricao"
            - candidatos-import.ts: chaveNatural passa a operar sobre CandidatoResolvido,
              usando cargo_id — NÃO o texto
            - o DEDUP roda depois de aplicarResolucoes (ver pipeline_da_importacao) — é
              nesta etapa que a ordem antiga vira bug real
            E mensagemErroImportacao aprende o nome novo do índice.
        - acao: "Renomear cargo passa a ser inofensivo — provar"
          detalhe: >
            O ganho concreto desta etapa. UPDATE cargos SET nome = 'DOCENTE I — HISTÓRIA'
            e conferir que os 481 candidatos continuam 481, com o nome novo na tela.
            Hoje a mesma correção criaria 481 registros.
      testes:
        - "Atualizar as asserções de onConflict (useCandidatos.test.tsx, CandidatosImportar.ui.test.tsx) e as de chaveNatural/mensagemErroImportacao em candidatos-import.test.ts"
        - "NOVO em candidatos-import.test.ts: dedup pós-resolução funde dois textos do mesmo cargo (o caso que a ordem antiga deixaria passar)"
        - "⚠️ Testes que quebrarem aqui são a especificação mudando de propósito — conferir um a um, não silenciar em bloco"
        - arquivo: "verificação manual, docs/bateria-cargos.sql + PostgREST"
          casos: |
            - importar, reimportar 2× → contagem estável (idempotência)
            - CONTROLE POSITIVO: reimportar com nome de candidato mudado ATUALIZA a linha
            - renomear o cargo NÃO duplica candidato — o ponto inteiro da etapa
            - linha sem CPF continua sendo uma só depois de 3 reimportações
            - duas grafias mapeadas ao mesmo cargo → reimportar não cria segunda linha
          atencao: >
            Verificar pelo PostgREST, não só por SQL: é o PostgREST que precisa INFERIR o
