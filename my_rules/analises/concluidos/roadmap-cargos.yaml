# Roadmap — Cargos como entidade (o cargo do candidato deixa de ser texto sujo da origem)
# Criado em 2026-07-27. VIVO: nada aqui foi implementado ainda.
# Revisado em 2026-07-27 (mesmo dia) a pedido do usuário, em quatro eixos:
#   UX · higidez/correção do código · RLS+GRANTS/Supabase · fatiamento das etapas.
# Leia my_rules/analises/README.md antes de usar este arquivo como guia.

roadmap:
  titulo: "Cargos — o texto sujo da planilha vira referência a um cargo cadastrado, sanitizado pelo usuário"
  criado: "2026-07-27"
  status: >
    ✅ TEMA COMPLETO — etapas 1 a 6 concluídas (janelas A, B, C e D). Só a 7 (página
    /cargos) segue NÃO planejada, por D7. O tema entregou o que prometia: renomear cargo
    não duplica candidato — e desde a 6 isso APARECE na tela.
    ---- etapa 6, 2026-07-29 ----
    (6) a lista e a ficha passaram a exibir `cargos.nome` (join à esquerda embutido no
    select da listagem) e o cabeçalho ganhou o filtro por cargo, recortado no SERVIDOR.
    Suíte 965/965 em 51 arquivos (+15), tsc e build limpos, lint de volta ao baseline de
    110 por `npx eslint src`. Verificado PELO POSTGREST com JWT de admin forjado: o embed
    devolve objeto e mantém as 3 linhas (a de cargo_id nulo com "cargos": null); o recorte
    devolve 1 e o count é o do recorte; e o CONTROLE NEGATIVO mostrou que `cargos!inner`
    some com o inscrito sem cargo E derruba o count (2 de 3). Dados de teste apagados.
    🔴 A etapa achou um defeito PREEXISTENTE: "limpar edital" anunciava o total FILTRADO
    numa ação que apaga o edital inteiro — prometia 12, removia 7.416. Corrigido com
    regressão; a visibilidade do botão também passou a olhar o total do edital.
    ---- etapas 5 e 5b, 2026-07-28 ----
    (5) migration 20260728100000: pré-check medido (0 candidatos, 0 cargos, 0 apelidos no
    local), backfill defensivo + guarda de colisão, DROP/CREATE do índice único e DROP da
    coluna cargo_chave. (5b) migration 20260728110000: trigger BEFORE INSERT com SQLSTATE
    RC001. As quatro coisas concordam, e a ORDEM do pipeline virou erro de compilação em
    vez de disciplina (deduplicar só aceita LinhaResolvida).
    Suíte 950/950 em 51 arquivos, tsc e build limpos. Bateria SQL verde nos 7 casos novos,
    e a verificação PELO POSTGREST passou nos 7 (inclusive os dois controles positivos).
    ⚠️ A guarda da 5b NÃO ficou em cargo_apelidos — ver ajuste_2 de D11, verificado no
    código: aquela tabela não é o caminho do dado, o lote é atômico e o erro é engolido.
    ---- histórico ----
    ✅ JANELAS A e B — etapas 1 a 4 concluídas em 2026-07-27.
    (4) o passo "Cargos" no assistente, nas três subetapas 4a/4b/4c — 20 testes novos.
    O usuário JÁ VÊ o passo, e `candidatos.cargo_id` já é gravado.
    ⚠️ Mas a chave natural AINDA é o texto: renomear cargo ainda duplica candidato, que é
    o sintoma que motivou o tema. A etapa 5 é o que fecha isso — não deixar o estado
    atual no ar por tempo indeterminado.
    Suíte 946/946 em 51 arquivos, tsc e build limpos, lint em 86 (baseline 90).
    ---- histórico ----
    ✅ JANELA A — etapas 1, 2 e 3 concluídas em 2026-07-27.
    (1) migration 20260727210000: as duas tabelas, candidatos.cargo_id, os índices de
    apoio, os GRANTS enxutos e a RLS — verificados por docs/bateria-cargos.sql, verde.
    (2) lib pura em candidatos-import.ts: cargosDaPlanilha, pareceSujo, aplicarResolucoes
    e o tipo CandidatoResolvido — 22 testes.
    (3) hooks em useCargos.tsx: catálogo, apelidos, criação e gravação — 26 testes.
    Suíte 925/925 em 51 arquivos, tsc e build limpos, lint em 86 (baseline 90).
    D1 (catálogo global) e D4 (pareamento obrigatório) CONFIRMADOS pelo usuário em
    2026-07-27. D8 (RLS/grants) CONFIRMADO na execução da etapa 1.
    ⚠️ D10 foi CORRIGIDA na execução da etapa 3 — ver o status de lá.
    As demais (D2, D3, D5, D6, D7, D9) seguem como proposta do desenho.
  origem: >
    Pedido do usuário em 2026-07-27: "os cargos vêm como nome sujo". Criar uma tabela de
    cargos no Supabase e um passo novo no assistente de importação, entre o pareamento e a
    importação, que mostre os cargos lidos e deixe o usuário associá-los a cargos existentes
    ou criar novos — redigitando o nome para sanitizá-lo ao critério dele.

  branch:
    nome: feat/cargos
    base: dev
    lembrete: >
      Regra do projeto: tema sai de dev e volta para dev com merge --no-ff, e a branch é
      apagada quando o tema fecha. main segue congelada na v1.0.0.

  # ═══════════════════════════════════════════════════════════════════════════
  medicao_previa: |
    MEDIDO em 2026-07-27 contra o arquivo real (docs/temp/todos inscritos concurso
    002-2026-SMA cabeçalho.xls), coluna AC — a SEGUNDA coluna chamada NOME.
    Regra 5 de estrutura/transversais/invariantes.md: medir antes de dimensionar.

      linhas de dado ............. 7.416
      cargos DISTINTOS ............... 9      ← o número que torna a UI trivial
      cargos com caractere sujo ...... 7 de 9
      linhas com a célula de cargo VAZIA ... 0   ← relevante para D9

      3.756  "DOCENTE II"
        730  "DOCENTE I ¿ EDUCAÇÃO FÍSICA"      ← sujo
        650  "DOCENTE I ¿ MATEMÁTICA"           ← sujo
        639  "DOCENTE I ¿ LÍNGUA PORTUGUESA"    ← sujo
        481  "DOCENTE I ¿ HISTÓRIA"             ← sujo
        386  "DOCENTE I ¿ CIÊNCIAS"             ← sujo
        331  "DOCENTE I ¿ GEOGRAFIA"            ← sujo
        248  "DOCENTE I ¿ LÍNGUA INGLESA"       ← sujo
        195  "ARTE"

    TRÊS CONCLUSÕES QUE O DESENHO INTEIRO SE APOIA:

    1. São NOVE, não centenas. A tela do passo novo é uma tabela de 9 linhas, não uma
       ferramenta de mapeamento em massa. Paginação, busca e "aplicar a todos" são
       desnecessários — e acrescentá-los seria complexidade sem uso.

    2. O `¿` é um travessão mal decodificado (em dash em cp1252 lido como latin-1). NÃO é
       corrigível por algoritmo com segurança: trocar `¿` por `—` acerta nestes 7 casos,
       mas é um palpite sobre o que a origem quis dizer. Medido: normalizar por
       lower + colapso de espaços deixa 9 distintos, ou seja, NÃO COLAPSA NADA — não há
       limpeza automática que resolva. É a justificativa de o passo ser manual.

    3. "ARTE" é o caso que prova a necessidade de julgamento humano. Foge do padrão
       `DOCENTE I ¿ <disciplina>` dos outros sete. É "DOCENTE I — ARTE" escrito de outro
       jeito? É um cargo diferente de verdade? Nenhuma regra sabe; o usuário sabe. Uma
       heurística que "consertasse" isso sozinha erraria em silêncio — o defeito que este
       repo já pagou caro (ver o `TIPOPROVA` em 00-modulo.md). É também por "ARTE" que a
       tela mostra EXEMPLOS de inscritos por cargo (ver etapa 4b): ver três nomes e a
       contagem ajuda a decidir o que o rótulo sozinho não diz.

  # ═══════════════════════════════════════════════════════════════════════════
  contexto: |
    HOJE (depois da migration 20260727200000):

      candidatos.cargo        text                        -- o texto CRU da planilha
      candidatos.cargo_chave  text GENERATED STORED       -- lower(btrim(coalesce(cargo,'')))
      índice único: (edital_id, cpf, cargo_chave, n_inscricao) NULLS NOT DISTINCT

    O cargo é TEXTO e faz parte da IDENTIDADE do candidato. As duas coisas juntas são o
    problema que este roadmap resolve, e que abriu a revisão de 27/07:

      corrigir o texto do cargo e reimportar CRIA UM SEGUNDO REGISTRO e mantém o antigo.

    Verificado no banco: caixa e espaço são normalizados por `cargo_chave` e atualizam a
    linha, mas trocar `¿` por `—` produz outra `cargo_chave` — logo, outra linha. A
    promessa "corrija a planilha e reimporte" NÃO VALE para os campos da chave. Com o
    texto sujo dentro da identidade, ela nunca vai valer.

    O assistente de importação (src/pages/CandidatosImportar.tsx) tem HOJE 4 passos:
      1. Arquivo   (edital + upload)
      2. Pareamento (coluna da planilha → campo da tabela)
      3. Importação (barra de progresso, blocos de 500)
      4. Relatório

    O passo pedido entra ENTRE o 2 e o 3. A numeração dos posteriores anda:

      1. Arquivo   2. Pareamento   3. CARGOS ←novo   4. Importação   5. Relatório

    DADO EXISTENTE (medido em 2026-07-27): a tabela `candidatos` está VAZIA no banco
    local (o dump do v1 não a tem; as 7.416 linhas de verificação foram apagadas). Isso
    importa para a etapa 5 — ver o pré-check de lá. Se alguém importar de verdade entre
    as fatias, o pré-check deixa de ser formalidade.

  # ═══════════════════════════════════════════════════════════════════════════
  # A ordem do fluxo de dados — o contrato que as etapas 2, 4 e 5 têm de respeitar.
  # Errar esta ordem é defeito SILENCIOSO, por isso ela está aqui e não dentro de uma etapa.
  pipeline_da_importacao: |
    A partir da etapa 4, a importação passa a ter QUATRO estágios, nesta ordem:

      1. converterLinha   planilha → CandidatoImportado (cargo = texto CRU; erro/aviso)
      2. aplicarResolucoes  texto_chave do cargo → cargo_id decidido no passo 3
      3. deduplicar       sobre a chave RESOLVIDA (com cargo_id a partir da etapa 5)
      4. blocos de 500    upsert com onConflict

    ⚠️ O DEDUP MUDA DE LUGAR: hoje ele roda num useMemo sobre as linhas convertidas
    (CandidatosImportar.tsx:110), ANTES de existir resolução. A partir da etapa 5 isso
    fica ERRADO: dois textos sujos mapeados para o MESMO cargo são a MESMA chave no
    banco, e um dedup sobre o texto os deixaria passar como distintos — o bloco de 500
    falharia inteiro com "cannot affect row a second time". O dedup tem de rodar DEPOIS
    de aplicarResolucoes.

    Consequências concretas, para não descobrir na marra:
      - O contador do botão "Importar N candidato(s)" passa a vir do lote PÓS-resolução
        e PÓS-dedup — no passo 3, não no 2. Mostrar N no passo 2 e importar N-k no passo
        4 confundiria; o passo 2 mostra "linhas lidas", o passo 3 mostra o N final.
      - `chaveNatural()` muda de assinatura na etapa 5: passa a operar sobre o candidato
        RESOLVIDO (com cargo_id). Até lá (etapas 1-4), continua sobre o texto — e isso é
        CORRETO nesse intervalo, porque a chave do banco ainda é o texto.
      - `repetidas` (o relatório de linhas substituídas) muda de significado junto: a
        partir da etapa 5, "repetida" inclui duas grafias do mesmo cargo. O texto do
        relatório tem de dizer isso ("mesmo cargo após a associação"), senão o usuário
        procura uma repetição literal que não existe na planilha.

  # ═══════════════════════════════════════════════════════════════════════════
  modelo_de_dados: |
    DUAS tabelas novas. A segunda é o que faz o passo novo não ser trabalho repetido a
    cada importação — sem ela, o usuário remapeia os 9 cargos toda vez.

    cargos (NOVA) — o catálogo canônico, com o nome que o usuário definiu
      id           uuid PK DEFAULT gen_random_uuid()
      nome         text NOT NULL              -- o nome LIMPO, digitado pelo usuário
      nome_chave   text GENERATED STORED      -- lower(btrim(nome)), para a unicidade
      ativo        boolean NOT NULL DEFAULT true
      created_at / updated_at (timestamptz DEFAULT now())
      created_by   uuid REFERENCES auth.users(id)      -- padrão de candidatos
      UNIQUE (nome_chave)
      CHECK (btrim(nome) <> '')

    cargo_apelidos (NOVA) — memória de "este texto sujo significa aquele cargo"
      id            uuid PK DEFAULT gen_random_uuid()
      texto_origem  text NOT NULL             -- o texto CRU, como veio da planilha
      texto_chave   text GENERATED STORED     -- lower(btrim(texto_origem))
      cargo_id      uuid NOT NULL REFERENCES cargos(id) ON DELETE CASCADE
      created_at / created_by
      UNIQUE (texto_chave)
      CHECK (btrim(texto_origem) <> '')
      INDEX (cargo_id)          -- apoio ao CASCADE; sem ele, apagar cargo varre a tabela

    candidatos (ALTERADA)
      + cargo_id  uuid REFERENCES cargos(id) ON DELETE RESTRICT
      + INDEX (cargo_id)        -- ⚠️ apoio ao RESTRICT e ao join da listagem. O índice
                                --   único novo começa por edital_id, então NÃO serve
                                --   para "quem usa este cargo?" — sem índice próprio,
                                --   cada DELETE em cargos faria seq scan em candidatos.
        MANTÉM cargo (texto cru) — ver D2
        DROPA  cargo_chave junto com a troca da chave — ver D3

    A chave natural passa de
        (edital_id, cpf, cargo_chave,  n_inscricao)
    para
        (edital_id, cpf, cargo_id,     n_inscricao)     NULLS NOT DISTINCT

    ⚠️ CASCADE no apelido é de propósito: apelido não é histórico, é um atalho de
    digitação. Apagar o cargo deve levar os apelidos dele. Já `candidatos.cargo_id` é
    RESTRICT pelo motivo oposto — apagar um cargo não pode sumir com inscrito.

    ⚠️ `cargo_id` fica NULLABLE no banco mesmo depois da etapa 5, obrigatório só no app —
    o MESMO desenho de provas.edital_id (D5 do roadmap-editais): a ordem migration →
    seed/dado impede um NOT NULL honesto, e a obrigatoriedade real é imposta por D4 na
    UI + a colisão do NULLS NOT DISTINCT no índice.

  # ═══════════════════════════════════════════════════════════════════════════
  supabase_grants_e_rls: |
    A parte que NÃO pode ser herdada por omissão. Contexto: o ALTER DEFAULT PRIVILEGES
    da era Lovable (registrado na migration 20260712010000) dá a TODA TABELA NOVA de
    public o pacote completo — SELECT/INSERT/UPDATE/DELETE/TRUNCATE/REFERENCES/TRIGGER
    para anon E authenticated. Foi assim que `candidatos` nasceu com `anon` podendo
    TRUNCATE (verificado: funciona, porque TRUNCATE NÃO PASSA POR RLS). O item sistêmico
    de enxugar tudo segue no backlog; estas DUAS tabelas não nascem repetindo o erro.

    Na MESMA migration que cria as tabelas (não numa segunda — tabela nunca fica exposta
    entre migrations):

      REVOKE ALL ON public.cargos, public.cargo_apelidos FROM anon;
      REVOKE TRUNCATE, REFERENCES, TRIGGER ON public.cargos, public.cargo_apelidos
        FROM authenticated;

    O que sobra: authenticated com SELECT/INSERT/UPDATE/DELETE — o mínimo para o
    PostgREST chegar a avaliar a RLS, que é quem barra de verdade. anon fica com NADA:
    nenhum fluxo público lê cargo (os fluxos públicos passam por Edge Function com
    service_role, não pela anon key).

    ⚠️ Isto CONVERSA com a 20260712010000, não briga: aquela migration registrou o
    estado herdado; esta revoga pontualmente nas tabelas novas. Quando o item sistêmico
    do backlog rodar, ele encontra estas duas já enxutas.

    RLS (D8): leitura para authenticated, escrita só admin.
      SELECT  TO authenticated USING (true)
      INSERT/UPDATE/DELETE  TO authenticated  USING/WITH CHECK has_role(auth.uid(),'admin')
      - `TO authenticated` explícito nas quatro: sem role alvo, a policy avalia também
        para anon — hoje inócuo (sem GRANT não chega lá), mas custa nada ser exato.
      - has_role cobre o superadmin (hierarquia DENTRO da função, migration
        20260725195530). NUNCA SELECT literal em user_roles — já bloqueou o superadmin
        3 vezes neste repo.
      - Sem SECURITY DEFINER em lugar nenhum: não há função nova nesta entrega. Se a
        etapa 7 (fusão de cargos) um dia existir, a RPC dela nasce SECURITY INVOKER e
        com SET search_path, como contar_candidatos_por_edital.

    Por que leitura aberta a authenticated e não fechada em admin como `candidatos`:
    nome de cargo não é dado de ninguém (como `editais`); fechar custaria uma policy a
    mais sem proteger nada. A tabela sensível continua sendo `candidatos`, que já é
    fechada — e o join da listagem (etapa 6) roda com o papel de quem já pode ler
    candidatos, então nada vaza por transitividade.

  # ═══════════════════════════════════════════════════════════════════════════
  decisoes:
    - id: D1
      titulo: "`cargos` é catálogo GLOBAL, não por edital"
      decidido: "sim — CONFIRMADO pelo usuário em 2026-07-27"
      racional: |
        "DOCENTE II" é o mesmo cargo no edital 001 e no 002. Um catálogo por edital
        obrigaria a recriar os 9 cargos a cada concurso e mataria o ganho do
        `cargo_apelidos`, que só compensa se atravessar importações.
      consequencia: |
        `cargos` NÃO tem edital_id, e `cargo_apelidos` também não: o apelido aprendido
        numa importação vale para todas as seguintes, de qualquer edital. É justamente
        isso que faz o passo novo virar conferência a partir da segunda importação.
      risco_aceito: >
        Se dois editais usarem o MESMO nome para cargos diferentes, o global os funde.
        Não ocorre no dado atual (um único edital com candidatos). Se vier a ocorrer, a
        saída é acrescentar edital_id a `cargos` — que é aditivo e não perde dado, então
        a decisão de hoje não fecha essa porta.

    - id: D2
      titulo: "`candidatos.cargo` (texto cru) PERMANECE, como procedência"
      decidido: "PROPOSTO — recomendado"
      racional: |
        Guardar o que a origem afirmou, ao lado do que o usuário decidiu, é o mesmo
        padrão de `concurso_id_origem`. Serve para três coisas concretas:
          - refazer o mapeamento depois, se o usuário mudar de ideia sobre "ARTE";
          - auditar de onde veio cada linha quando a lista divergir da planilha;
          - permitir que o `cargo_apelidos` seja reconstruído a partir do dado.
        Custo: uma coluna de texto por linha. Barato perto de perder a procedência.

    - id: D3
      titulo: "A chave natural troca `cargo_chave` por `cargo_id`, e `cargo_chave` é DROPADA"
      decidido: "PROPOSTO — é a decisão central do roadmap"
      racional: |
        É ISTO que conserta o problema de 27/07. Com `cargo_id` na identidade, o nome do
        cargo vira ATRIBUTO: renomear "DOCENTE I ¿ HISTÓRIA" para "DOCENTE I — HISTÓRIA"
        passa a ser um UPDATE numa linha de `cargos`, e NENHUM candidato duplica. Hoje
        essa mesma correção cria 481 registros novos.

        `cargo_chave` é dropada na MESMA migration que troca a chave, e não depois:
        deixar no schema uma coluna gerada cujo nome termina em `_chave`, sem chave
        nenhuma apontando para ela, é a definição de armadilha neste repo. O texto cru
        segue em `cargo` (D2), então nada se perde.
      nao_confundir: |
        ⚠️ Isto NÃO reverte a migration 20260727200000. O `cpf` continua na chave, e
        `n_inscricao` também. O que sai é só a coluna gerada do TEXTO do cargo, trocada
        pela REFERÊNCIA ao cargo. Continua valendo o que foi medido ontem: somar coluna
        a uma chave única separa linhas, nunca as funde.
      atencao_medir: >
        Trocar texto por referência PODE fundir linhas, ao contrário de somar. Se dois
        textos sujos diferentes forem mapeados para o MESMO cargo, as linhas daquela
        pessoa nos dois textos passam a ter a mesma chave. Está correto (é a mesma
        pessoa no mesmo cargo), e o `deduplicar()` resolve mantendo a última — mas
        PRECISA ser medido na etapa 5 antes de aplicar, não presumido. E precisa ficar
        VISÍVEL na tela do passo 3 quando acontecer (etapa 4b).
      o_drop_foi_confirmado: >
        ⚠️ D11 quase reabriu isto: o trigger da etapa 5b compara o texto normalizado do
        cargo, e a leitura apressada seria "então `cargo_chave` tem de sobreviver".
        DECIDIDO pelo usuário em 2026-07-28: o DROP fica, e o trigger calcula
        lower(btrim(coalesce(cargo,''))) inline. Manter a coluna gerada sem chave nenhuma
        apontando para ela é a armadilha que este D3 existe para eliminar — e o custo do
        inline é zero, porque a busca do trigger é por (edital_id, cpf, n_inscricao) e
        compara no máximo 4 linhas. NÃO ressuscitar `cargo_chave`.

    - id: D4
      titulo: "Parear a coluna de cargo é OBRIGATÓRIO, e resolver TODOS os cargos lidos também"
      decidido: "sim — CONFIRMADO pelo usuário em 2026-07-27"
      racional: |
        Com `cargo_id` na chave e `NULLS NOT DISTINCT`, deixar um cargo sem associação faz
        todas as linhas dele terem cargo_id NULL — e as inscrições da mesma pessoa em
        cargos diferentes colidem, ressuscitando a perda silenciosa de 396 inscritos que o
        aviso do passo 2 hoje combate. Não há meio-termo seguro: ou resolve, ou perde gente.
      consequencia: |
        Duas mudanças concretas, e a primeira é do passo 2, não do passo novo:

        1. O campo `cargo` passa de `obrigatorio: false` para `obrigatorio: true` em
           CAMPOS_CANDIDATO (src/lib/candidatos-import.ts). Efeito em cadeia:
           `mapeamentoCompleto()` passa a exigi-lo, e o botão do passo 2 fica desabilitado
           enquanto o cargo não for pareado. Uma planilha sem coluna de cargo deixa de ser
           importável — e é o comportamento pretendido.
           ⚠️ O campo NÃO ganha sinônimo automático: `'tipoprova'` continua fora, de
           propósito (a coluna existe e é 100% vazia; adivinhá-la zeraria o cargo). Passar
           a ser obrigatório é o oposto de passar a ser adivinhado — a pessoa PRECISA
           escolher a coluna, e agora não tem como seguir sem escolher.
        2. No passo 3, o botão Importar fica desabilitado enquanto houver qualquer cargo
           lido sem associação.

        A alternativa de um cargo "(não informado)" no catálogo foi DESCARTADA por esta
        decisão. Registrada aqui porque, se a operação vier a precisar importar planilha
        sem cargo, é a saída que preserva a identidade estável — e não reabrir o nulo.
      atencao_testes: >
        Tornar `cargo` obrigatório muda o comportamento de testes já existentes que montam
        mapeamento sem cargo. Em candidatos-import.test.ts há casos com
        `mapa({ n_inscricao: 0, nome: 1 })`, e em CandidatosImportar.ui.test.tsx o fluxo de
        importação. Quebra esperada e desejada: conferir um a um se cada quebra é a
        mudança pretendida, e não ajustar em bloco.

    - id: D5
      titulo: "`cargo_apelidos` memoriza o texto sujo; a próxima importação vem pré-preenchida"
      decidido: "PROPOSTO — é o que evita retrabalho"
      racional: |
        Sem memória, o usuário refaz os 9 mapeamentos a cada reimportação — e reimportar
        é o FLUXO NORMAL deste módulo, não a exceção. Com ela, a segunda importação do
        mesmo arquivo chega com tudo resolvido e o passo vira uma conferência.
        O apelido é gravado quando o usuário confirma o passo, não quando ele digita.
      atencao: >
        O apelido casa por `texto_chave` = lower(btrim(texto_origem)). Se a origem mudar
        a grafia, o apelido não casa e o cargo volta a aparecer sem associação — que é o
        comportamento certo: grafia nova merece decisão nova.

    - id: D6
      titulo: "⚠️ `cargos` NÃO tem relação nenhuma com `funcoes_colaboradores`"
      decidido: "constatação, não escolha — mas precisa estar escrita"
      racional: |
        A tabela `funcoes_colaboradores` tem uma coluna chamada `cargo_editavel`, e o
        vocabulário vai colidir na cabeça de quem ler. São coisas opostas:
          - `funcoes_colaboradores` = o que o COLABORADOR faz (fiscal, coordenador) —
            quem APLICA a prova. Tem valor de pagamento, meta por unidade, alocação.
          - `cargos` (nova)         = a vaga a que o CANDIDATO concorre — quem FAZ a prova.
            Não tem pagamento, não tem alocação, não tem meta.
        Nunca unificar as duas. Nunca reaproveitar `funcoes_colaboradores` "porque já
        existe uma tabela de cargos".

    - id: D7
      titulo: "Sem página /cargos própria nesta entrega; a gestão vive no assistente"
      decidido: |
        PROPOSTO — recomendado adiar. ⚠️ REVERTIDA PELO USUÁRIO em 2026-07-30, que pediu a
        página. O adiamento valeu enquanto valeu: o CRUD saiu depois do tema estabilizado,
        e ficou mais barato do que teria sido junto. Ver a etapa 7 para o que saiu.
      racional: |
        O pedido do usuário descreve criação e associação DENTRO do fluxo de importação.
        Uma rota nova custa entrada no RequireAcesso, no App.tsx e 5 combinações novas na
        matriz de guards (hoje 19 páginas × 5 papéis) — trabalho real por um CRUD que
        ninguém pediu. Renomear cargo já é possível pelo próprio passo (D3 torna renomear
        inofensivo). Se depois fizer falta, entra como etapa 7, desenhada abaixo.

    - id: D8
      titulo: "RLS de `cargos` e `cargo_apelidos`: leitura para autenticado, escrita só admin"
      decidido: "PROPOSTO — detalhado na seção supabase_grants_e_rls"
      racional: |
        Nome de cargo não é dado pessoal — é como `editais`, não como `candidatos` (que é
        fechada em admin nas 4 operações porque cada linha é CPF e endereço de cidadão).
        Escrita só admin porque só admin importa. Grants enxutos NA CRIAÇÃO (a lição do
        TRUNCATE de candidatos), policies com TO authenticated explícito, has_role sempre.

    - id: D9
      titulo: "Célula de cargo VAZIA numa linha → a linha vira ERRO (descarta e acusa)"
      decidido: "PROPOSTO — novo na revisão de 27/07"
      racional: |
        Hoje `converterLinha` aceita cargo null (o campo era opcional). Com D4 o cargo é
        identidade: uma linha sem cargo não tem o que associar no passo 3 — e criar um
        grupo "(em branco)" para o usuário apontar a um cargo seria decisão EM MASSA
        sobre linhas que ele não viu, o palpite invisível que este módulo evita.
        Tratar como as outras faltas de identidade (inscrição, nome): a linha não entra,
        o relatório diz qual e por quê.
      custo_medido: "0 linhas no arquivo real têm a célula vazia — a regra não descarta ninguém hoje."
      onde_entra: "Etapa 4c, junto com o resto de D4 — é a mesma migração de 'opcional' para 'identidade'."

    - id: D10
      titulo: "Criar cargo com nome que já existe NÃO é erro — vira associação"
      decidido: >
        sim, mas ⚠️ CORRIGIDA NA EXECUÇÃO (etapa 3, 2026-07-27): a INTENÇÃO abaixo vale
        inteira; o MEIO proposto (`ignoreDuplicates: false`) estava errado e renomearia o
        cargo existente. Implementado com `ignoreDuplicates: true` + busca em dois passos.
        Ler o status da etapa 3 antes de mexer nisto.
      racional: |
        Dois caminhos chegam ao mesmo lugar: o usuário digita "DOCENTE II" no input de
        criar sem ver que já está no catálogo; ou dois admins importam ao mesmo tempo e
        os dois criam (corrida real, sem lock possível no cliente). Nos dois casos a
        intenção é "quero ESTE cargo" — devolver 'duplicate key' crua trata intenção
        certa como erro.
        ⚠️ A implementação abaixo é a PROPOSTA ORIGINAL, e ela NUNCA CHEGOU A SER VERDADE:
        "criarCargo faz upsert com onConflict 'nome_chave' + select do id
        (ignoreDuplicates: false, para devolver a linha existente)."
        MEDIDO e descartado — com `false` o ON CONFLICT DO UPDATE renomeia a linha
        existente para a grafia que o usuário digitou. O que valeu foi `true` (DO NOTHING,
        que preserva o nome e devolve `[]`) mais um segundo passo buscando por nome_chave.
        O resto do parágrafo continua valendo: o chamador recebe o id nos dois casos e nem
        distingue; a UI, se quiser, informa "associado ao cargo já existente" — informação,
        não erro.
      limite: >
        Isso NÃO tenta resolver quase-duplicata ("Docente 2" vs "DOCENTE II") — só a
        colisão exata por nome_chave. Quase-duplicata é exatamente o julgamento humano
        que o passo 3 existe para exercer.

    - id: D11
      titulo: "⭐ Reapontar um texto JÁ IMPORTADO para outro cargo é bloqueado — e a guarda fica em `candidatos`, NÃO em `cargo_apelidos`"
      decidido: >
        sim — CONFIRMADO pelo usuário em 2026-07-28. Proposta dele ("depois da importação
        de candidatos de um edital, os cargos não podem ser modificados; exceção para
        cargos novos numa nova importação"), aceita com DOIS ajustes de alvo que ele
        confirmou no mesmo dia: o objeto protegido NÃO é o nome do cargo (ajuste 1,
        confirmado explicitamente — `cargos.nome` fica LIVRE), e a guarda NÃO é na tabela
        de apelidos (ajuste 2). Está no mesmo nível de D1 e D4: decisão do usuário, não
        proposta do desenho.
      racional: |
        ⭐ A ETAPA 5 INVERTE QUAL ERRO É FATAL. Isto não estava escrito em lugar nenhum e
        é a razão de existir a etapa 5b:

                                            | hoje (chave = texto) | pós-etapa 5 (chave = cargo_id)
          origem muda a grafia do cargo      | 🔴 DUPLICA           | ✅ re-resolve → mesma chave → UPDATE
          usuário reaponta um texto p/ outro | ✅ cargo_id fora da  | 🔴 DUPLICA e ÓRFÃ as linhas antigas
          cargo                              |    chave → UPDATE    |

        O caso concreto, e ele NÃO é hipotético — é o que a medicao_previa antecipou:
        "ARTE" é resolvido para o cargo A na primeira importação (195 inscritos, cargo_id
        = A). Depois de ver os dados, o usuário conclui que ARTE é o cargo B e troca a
        associação no passo 3. O upsert grava a chave (edital, cpf, B, inscrição), que não
        casa com nada → INSERT de 195 linhas novas. As 195 antigas com A FICAM LÁ.
        390 linhas, metade órfã, e NADA acusa.

        Mudar de ideia sobre "ARTE" é o comportamento ESPERADO deste passo, não o
        desviante — a conclusão 3 da medicao_previa diz que só o usuário sabe, e ele só
        sabe depois de ver. Deixar o gesto esperado produzir perda silenciosa é o defeito
        que o módulo inteiro foi desenhado para não ter.
      ajuste_1_o_objeto: |
        A proposta original congelava o CARGO ("os cargos não podem ser modificados"). Mas
        pós-etapa 5 o `cargos.nome` saiu da chave — renomear é cosmético e NÃO duplica
        ninguém. Congelá-lo proibiria justamente a operação que a etapa 5 existe para
        tornar segura, e faria de um erro de digitação na PRIMEIRA importação uma cicatriz
        permanente em toda ficha (o catálogo nasce vazio; os nomes canônicos são criados
        no passo 3 da primeira importação real).

          cargos.nome ............. LIVRE. Com aviso nomeando o alcance ("este nome vale
                                    para N inscritos em M editais"), porque por D1 o
                                    catálogo é GLOBAL e o rename atravessa editais.
          cargo em uso, DELETE .... já recusado pelo RESTRICT da etapa 1. Nada a fazer.
          cargo NOVO .............. INSERT, sempre livre. A exceção que o usuário pediu
                                    sai de graça: ela é o comportamento padrão.
          reapontamento ........... 🔒 BLOQUEADO. É o único gesto que órfã inscrito.
      ajuste_2_a_tabela: |
        ⚠️ A guarda ÓBVIA seria um trigger em `cargo_apelidos` bloqueando o UPDATE de
        `cargo_id`. Ela guardaria a TABELA ERRADA, e as três razões foram verificadas no
        código em 2026-07-28:

        1. O apelido NÃO é o caminho do dado, é a memória de PRÉ-PREENCHIMENTO. Quem
           decide o cargo_id do lote é `aplicarResolucoes(candidatos, resolucoes)`
           (CandidatosImportar.tsx), e `resolucoes` é estado da UI — o Map que o usuário
           acabou de editar na tela. Bloquear a tabela não impede a gravação errada.
        2. `salvarApelidos` manda os ~9 pares num upsert ÚNICO e atômico ("ou entram
           todos, ou nenhum" — está no comentário do hook). Barrar UM par derrubaria os
           NOVE, perdendo atalhos que não têm nada a ver com o problema.
        3. O chamador ENGOLE o erro de propósito: `await salvarApelidos(pares).catch(() =>
           undefined)`, com a assimetria deliberada da etapa 4 (apelido é conveniência, a
           importação é o objetivo). Ou seja, a guarda falharia em SILÊNCIO e a importação
           seguiria gravando o cargo_id novo assim mesmo.

        A guarda tem de ficar onde o dano acontece: em `candidatos`.
      onde_a_guarda_funciona: |
        Trigger BEFORE INSERT em `candidatos`, com condição ESTREITA:

          já existe linha com (edital_id, cpf, n_inscricao, cargo_chave) IGUAIS
          e cargo_id DIFERENTE  →  RAISE

        ⚠️ A estreiteza é obrigatória, não zelo. "Mesma inscrição, cargo_id diferente"
        SOZINHO bloquearia o caso legítimo mais comum do arquivo real: 382 pessoas
        concorrem a mais de um cargo COM A MESMA INSCRIÇÃO (é por isso que o cargo está na
        chave). É só o `cargo_chave` IGUAL que permite afirmar "esta é a MESMA linha da
        planilha, apontada para outro cargo" — reapontamento, e não segundo cargo.

        O `cargo_chave` continua servindo a isto DEPOIS de sair da chave natural — ver a
        ressalva em D3, que manda dropá-lo. As duas coisas conflitam: resolver na etapa 5b.
      o_que_fica_de_fora: |
        Se a origem mudar a GRAFIA e o usuário reclassificar para outro cargo no mesmo
        gesto, o `cargo_chave` difere e o trigger não vê. Fica órfão do mesmo jeito.
        É irredutível: o arquivo NÃO TEM identificador por cargo (medido — a única coluna
        única por linha é o contador), então banco nenhum distingue "reclassificaram esta
        pessoa" de "esta pessoa tem um segundo cargo". Quem pega este resíduo é a
        RECONCILIAÇÃO, não um trigger.
      alternativa_que_cobre_mais: |
        A **reconciliação** já está desenhada (00-modulo.md, saída 2 do custo aceito da
        chave natural): ao fim da importação, listar quem está no BANCO e não veio no
        ARQUIVO. Ela pega os 195 órfãos DEPOIS do fato — e pega junto os órfãos de CPF
        corrigido e de inscrição corrigida, os três com um mecanismo só.
        NÃO substitui D11: reconciliação é DETECÇÃO, D11 é PREVENÇÃO, e prevenir o gesto
        esperado é mais barato que limpar depois. Mas se a reconciliação for feita, o
        resíduo de `o_que_fica_de_fora` deixa de ser resíduo.
      barrar_sem_orientar: >
        ⚠️ A lição da etapa 4 vale inteira aqui: barrar sem orientar só troca um problema
        por outro. Bloquear é DOWNGRADE de gravidade — converte perda silenciosa em "ainda
        não dá" explícito. A mensagem tem de dizer QUAL texto, para QUAL cargo ele já foi
        importado, e que a mudança exige migrar os inscritos (etapa 7). Erro cru de trigger
        na cara do usuário não fecha esta decisão.
      o_certo_que_nao_cabe_agora: >
        O comportamento HONESTO seria o reapontamento MOVER os 195 inscritos de A para B,
        não duplicá-los — mudar de ideia deveria simplesmente funcionar. Isso é a fusão de
        cargos da etapa 7 (RPC transacional SECURITY INVOKER com SET search_path), e
        trazê-la para a janela C dobraria o tamanho da etapa mais arriscada do tema.
        D11 é a versão barata: ~1 trigger em vez de 1 RPC + UI de migração.

  # ═══════════════════════════════════════════════════════════════════════════
  # FATIAMENTO — como as etapas viram trabalho mergeável.
  # Cada fatia fecha VERDE: npm test + npx tsc --noEmit -p tsconfig.app.json + npm run
  # build (não há CI, por decisão de 25/07 — rodar à mão é parte de fechar a fatia).
  fatiamento: |
    JANELA A — inerte (etapas 1, 2, 3). Nenhum comportamento visível muda; o app nem
      referencia o que foi criado. As três podem ser mergeadas juntas ou uma a uma, em
      qualquer ordem entre 2 e 3 (ambas dependem só da 1 para os tipos). Risco de merge
      ~zero; é a parte que dá para fazer em sessões curtas.

    JANELA B — o comportamento novo (etapa 4, em três subetapas 4a→4b→4c). O usuário
      passa a ver o passo Cargos. As subetapas são fatias de IMPLEMENTAÇÃO (cada uma
      verde), mas a janela é UM tema: mergear 4a sozinha entregaria um passo sem criar
      cargo — beco sem saída quando o catálogo está vazio. Mergear B completa.

    JANELA C — a troca de identidade (etapas 5 e 5b). Pode ir no MESMO merge de B (ideal)
      ou logo depois. O estado B-sem-C é funcional e não corrompe nada (cargo_id gravado,
      chave ainda no texto), mas o ganho central — renomear sem duplicar — só existe com
      C. Não deixar B no ar por tempo indeterminado sem C: nesse intervalo, corrigir
      nome de cargo na planilha ainda duplica candidato, e alguém vai concluir que o
      tema "não funcionou".
      ⚠️ Se houver importação real entre B e C, o pré-check da etapa 5 deixa de ser
      formalidade — ler lá antes de aplicar a migration.

      ⭐ 5 e 5b são INSEPARÁVEIS, em MIGRATIONS SEPARADAS. O buraco que a 5b tapa abre no
      exato instante em que o índice da 5 troca (ver a tabela de inversão em D11): antes
      disso a guarda seria inócua, depois disso a ausência dela é perda silenciosa. Não
      existe intervalo em que faça sentido ter uma sem a outra — por isso, mesmo merge.
      Migrations separadas porque a da etapa 5 já carrega pré-check e backfill
      condicional: misturar um trigger ali torna ambíguo O QUE falhou quando ela falhar.
      Ordem: 5 primeiro (o índice), 5b depois (a guarda sobre o índice novo).

    JANELA D — cosmética (etapa 6). Qualquer momento depois de C. Pode inclusive vir
      depois do merge do tema, como melhoria isolada.

    A etapa 7 está FORA das janelas: não é desta entrega (D7).

