        com o texto EXATO que o PostgREST devolveu, para pegar quem acrescentar um ramo
        largo antes do fallback.

        Bateria (docs/bateria-cargos.sql, seção 7) e PostgREST, os dois verdes:
        reapontamento recusado com a mensagem nossa; CONTROLE POSITIVO 1 (mesma pessoa em
