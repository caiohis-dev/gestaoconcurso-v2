    - id: 2
      titulo: "Lib pura — cargos da planilha, resolução e a nova ordem do pipeline"
      janela: "A"
      status: |
        ✅ CONCLUÍDA em 2026-07-27, em `src/lib/candidatos-import.ts`. Entregue conforme o
        desenho: `cargosDaPlanilha`, `pareceSujo`, `aplicarResolucoes`, `ResumoCargo`,
        `CandidatoResolvido` e `ResolucaoCargos`. 22 testes novos (arquivo com 66).

        Decisões pequenas tomadas na execução, que o desenho não fixava:
        - `textoOrigem` é o texto da PRIMEIRA ocorrência, não o mais frequente. É
          determinístico e é o que a pessoa encontra ao rolar a planilha; eleger o mais
          frequente mudaria o rótulo conforme o arquivo, sem ganho.
        - `cargosDaPlanilha` PULA cargo vazio em vez de criar um grupo "(em branco)".
          Aquele grupo convidaria a apontar um cargo para milhares de linhas não vistas —
          decisão em massa às cegas. Célula vazia é problema da LINHA (D9, na 4c).
          Consequência a lembrar na 4a: enquanto D9 não entrar, uma linha com cargo vazio
          não aparece na tabela de resolução E sai marcada de aplicarResolucoes — ou seja,
          bloquearia a importação sem oferecer onde resolver. É a 4c que fecha isso.
        - `pareceSujo` ganhou um teste que guarda a ASSINATURA (`typeof === 'boolean'`):
          se alguém a transformar num sanitizador, o teste cai. A limpeza automática foi
          medida e descartada, e a marca precisa continuar sendo só sinalização.

        ⭐ A separação de tipo foi VERIFICADA, não presumida: com um arquivo temporário,
        `CandidatoResolvido[] → CandidatoImportado[]` compila e o inverso dá TS2322. É o
        que impede um lote não-resolvido de chegar ao hook por engano na etapa 5.
      objetivo: >
        Toda a decisão difícil fica PURA e testável sem mock, como candidatos-import.ts já
        faz. É o que separa este fluxo do CadastroLote, onde a mesma lógica vive dentro de
        um componente de 1.100 linhas e não tem como ser exercitada.
      acoes:
        - acao: "`cargosDaPlanilha(convertidas): ResumoCargo[]`"
          detalhe: |
            Opera sobre as LINHAS JÁ CONVERTIDAS (não sobre a planilha crua): linha com
            erro não conta para cargo nenhum, e a soma dos grupos bate com o total
            importável — dois invariantes testáveis.
            Devolve, por cargo distinto:
              { textoOrigem, textoChave, linhas: number, exemplos: string[] }
            - ordenado por `linhas` decrescente (o de 3.756 primeiro);
            - `exemplos` = até 3 nomes de inscritos daquele cargo. É UX barata e pura, e
              é o que ajuda a decidir "ARTE" (ver medicao_previa, conclusão 3);
            - textoChave = lower(btrim(...)), a MESMA normalização de
              cargo_apelidos.texto_chave — se divergirem, o pré-preenchimento erra.
        - acao: "`pareceSujo(texto): boolean`"
          detalhe: |
            Detecta caractere de mojibake ('¿', '�') para a tela DESTACAR — nunca para
            corrigir sozinha. Sinalização visual; consertar automaticamente é o palpite
            que a medição desaconselha.
        - acao: "`aplicarResolucoes(candidatos, resolucoes): CandidatoResolvido[]`"
          detalhe: |
            resolucoes: Map<texto_chave, cargo_id>. Devolve o candidato com cargo_id.
            É o estágio 2 do pipeline_da_importacao — função separada, não um detalhe
            dentro da página, porque o dedup da etapa 5 depende de rodar DEPOIS dela.
            Comportamento com resolução faltante: devolve a linha marcada (não lança e
            não silencia) — a UI decide bloquear, e D4 garante que bloqueia.
        - acao: "Tipos"
          detalhe: |
            CandidatoImportado NÃO ganha cargo_id — quem tem cargo_id é CandidatoResolvido
            (extends). A distinção de tipo torna impossível mandar lote não-resolvido
            para o hook por engano: o TS acusa. Higidez por assinatura, não por disciplina.
      testes:
        - arquivo: "src/lib/candidatos-import.test.ts (estender — hoje 44 testes, puros, sem mock)"
          casos: |
            - agrupa por texto normalizado: 'DOCENTE II' e ' docente ii ' são UM cargo
            - a SOMA das contagens bate com o total de linhas convertíveis (invariante)
            - linha descartada por erro não conta para nenhum cargo
            - ordena por contagem decrescente; exemplos traz até 3 nomes, sem repetir
            - cargo não pareado (mapeamento.cargo === null) → lista VAZIA, sem lançar
            - pareceSujo pega '¿' e '�' e NÃO pega acento legítimo ('CIÊNCIAS' é limpo)
            - aplicarResolucoes: resolve todos; faltante sai MARCADO, não silenciado
            - ⭐ o texto exato dos 9 cargos medidos, como regressão da medição
      documentacao:
        - "cargos.md — a seção de como a planilha é lida, os 9 cargos medidos, a razão de a limpeza não ser automática e o pipeline em 4 estágios"

