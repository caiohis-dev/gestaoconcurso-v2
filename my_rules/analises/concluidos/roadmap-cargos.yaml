      acoes:
        - acao: "O conflito com D3 — RESOLVIDO pelo usuário em 2026-07-28"
          detalhe: |
            D3 manda DROPAR `candidatos.cargo_chave` na migration da etapa 5, e a condição
            do trigger compara justamente o texto normalizado do cargo. As duas não podiam
            valer como escritas.

            DECIDIDO: MANTER o drop de D3, e o trigger calcula a expressão inline
              lower(btrim(coalesce(NEW.cargo, '')))  =  lower(btrim(coalesce(c.cargo, '')))
            Não custa índice: a busca é por (edital_id, cpf, n_inscricao), que o índice
            único novo cobre pelo PREFIXO (edital_id, cpf) e é seletiva por natureza — a
            distribuição medida é 6.638 inscrições com 1 cargo, 369 com 2, 12 com 3 e 1
            com 4, ou seja, no MÁXIMO 4 linhas comparadas por candidato.
            Ressuscitar `cargo_chave` só para o trigger seria reintroduzir a coluna cujo
            nome termina em `_chave` sem chave nenhuma apontando para ela — exatamente a
            armadilha que D3 quis eliminar.
            ⚠️ CONFIRMAR com EXPLAIN que o prefixo é usado, no método da etapa 1. Trigger
            BEFORE INSERT roda por LINHA, e o caminho quente aqui é 7.416 delas.
        - acao: "Migration NOVA (separada da etapa 5) — o trigger"
          detalhe: |
            - FUNCTION em plpgsql, SECURITY INVOKER com SET search_path (o padrão do repo;
              ver contar_candidatos_por_edital). Não precisa de DEFINER: quem importa já é
              admin e já lê candidatos.
            - TRIGGER BEFORE INSERT ON candidatos FOR EACH ROW.
              ⚠️ INSERT, não UPDATE: no upsert, a linha que CASA a chave vira UPDATE e é o
              caminho correto (mesma pessoa, mesmo cargo, dados atualizados). O dano mora
              no INSERT que não casou porque o cargo_id mudou.
            - Condição ESTREITA, conforme D11:
                EXISTS (SELECT 1 FROM candidatos c
                        WHERE c.edital_id = NEW.edital_id
                          AND c.cpf IS NOT DISTINCT FROM NEW.cpf
                          AND c.n_inscricao = NEW.n_inscricao
                          AND lower(btrim(coalesce(c.cargo,''))) = lower(btrim(coalesce(NEW.cargo,'')))
                          AND c.cargo_id IS DISTINCT FROM NEW.cargo_id)
              ⚠️ `IS NOT DISTINCT FROM` no cpf: são 2 CPFs impossíveis que viram NULL, e
              `=` os deixaria escapar da guarda — o mesmo motivo do NULLS NOT DISTINCT.
            - RAISE com mensagem NOSSA, nomeando o texto e o cargo de destino atual, e
              com ERRCODE próprio para mensagemErroImportacao poder traduzir sem parsear
              texto livre.
            - COMMENT ON FUNCTION apontando para D11.
          nao_faca: |
            - NÃO pôr a guarda em `cargo_apelidos`: é a tabela errada, pelas 3 razões
              verificadas em D11 (não é o caminho do dado, o lote é atômico, e o chamador
              engole o erro de propósito).
            - NÃO bloquear UPDATE de `cargos.nome`: pós-etapa 5 é cosmético e é o ganho
              central do tema. Ver ajuste_1 de D11.
            - NÃO condicionar a "o edital terminou de importar": esse momento NÃO EXISTE no
              modelo — reimportar é o fluxo normal, não há evento de fim. A condição
              durável é "existe linha já importada", que é a mesma do RESTRICT da etapa 1.
        - acao: "A tela AVISA antes de o banco recusar"
          detalhe: |
            Barrar sem orientar troca um problema por outro (lição da etapa 4). No passo 3,
