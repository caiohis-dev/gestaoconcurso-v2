            ⚠️ Isto é UX, NÃO é a regra. A regra é o trigger. Regra de negócio só no
            cliente não é regra — ela não vale para PostgREST, Edge Function nem script.
            O aviso precisa de uma consulta ao banco (quais cargo_id já existem para
            aqueles textos naquele edital); se ela complicar, o aviso pode ficar para
            depois SEM segurar a migration — o trigger sozinho já impede a perda.
        - acao: "mensagemErroImportacao aprende o ERRCODE novo"
          detalhe: >
