    - id: "5b"
      titulo: "⭐ A guarda que a etapa 5 exige — reapontar cargo de linha já importada é recusado pelo banco"
      janela: "C"
      status: |
        ✅ CONCLUÍDA em 2026-07-28 — migration `20260728110000`, SQLSTATE `RC001`.
        Entregue conforme o desenho, com o conflito de D3 resolvido como decidido: o drop
