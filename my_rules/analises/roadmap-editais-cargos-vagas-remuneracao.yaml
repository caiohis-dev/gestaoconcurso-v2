  riscos: |
    R1. 🔴 **Esta fatia mexe numa tabela de produção que outro módulo usa.** A importação de
        candidatos é operação de véspera de prova: quebrá-la tem custo de calendário, não só
        de código. Daí a etapa 0 e a rerrodagem da bateria na etapa 3.

    R2. **O arredondamento das cotas errado não dá erro** — dá um edital com reserva legal
        abaixo do mínimo, descoberto por terceiros. É P1, e não se resolve por palpite.

    R3. **`cargos` passa a ter dois donos** (Candidatos e Editais). Quem mexer nela depois
        precisa saber dos dois. ⚠️ Os DOIS contratos de módulo têm de dizer isso — se só um
        disser, o outro vira armadilha.

  # ═══════════════════════════════════════════════════════════════════════════
  desvios_da_execucao: |
    🔴 A CG001 PRECISOU SER ESTREITADA, e isso não estava previsto.
       O trigger `cargos_recusa_alterar_com_inscritos` barrava QUALQUER update num cargo
       com inscritos, sem olhar a coluna. Com as colunas novas, o autor do edital não
       conseguiria definir `conselho_classe_obrigatorio` em nenhum cargo reaproveitado de
       um certame anterior — que é justamente quando importa.
       Decisão do usuário: estreitar para o NOME, que é o que a regra protege de fato.
       É a SEGUNDA vez (a primeira foi em 01/08, tirando `cargo_apelidos` da conta).
       ⚠️ Conferido antes de liberar: `cargos.ativo` não tem consumidor, então liberá-la
       não esconde dado. Registrado no caso 4b.3 da bateria de cargos.

    🔴 A FALSIFICAÇÃO ACHOU UM DEFEITO MEU, não do código. `ceil` e `floor` derrubam 10
       casos cada, mas trocar minha implementação elaborada de arredondamento por
       `Math.round` cru NÃO derrubou nenhum. Medido em seguida: zero divergências em
       200.000 totais. Simplifiquei — complexidade sustentada por um perigo que não se
       demonstra é um comentário que envelhece como verdade.

    ➕ AS VAGAS SÃO GRAVADAS, não recalculadas na leitura. Um edital publica números;
       recalcular faria um edital antigo mudar sozinho se a regra mudasse. A CHECK
       `chk_edital_cargo_vagas_somam` garante a coerência no banco.

    ➕ `NENHUM` é valor explícito de `conselho_classe_obrigatorio`, diferente de NULL:
       "não exige conselho" é afirmação, "ninguém preencheu" é outra coisa. A fatia 8
       depende dessa distinção para o linter do COREN.

    ⚠️ O que NÃO foi feito nesta fatia, e o roadmap previa: `cargos_beneficios`,
       `cargos_atribuicoes` e `vagas_distribuicao`. O Quadro I básico (cargo, código,
       vagas com cotas, vencimento) está de pé; benefícios e atribuições ficam para um
       passe seguinte, e a distribuição por unidade é a fatia 7.
