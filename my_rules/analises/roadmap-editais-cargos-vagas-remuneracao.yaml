  regra_das_cotas: |
    ✅ **P1 RESPONDIDA POR MEDIÇÃO em 2026-09-16.** A pergunta era: arredonda para cima?
    Para baixo? Há piso de uma vaga? Contei as vagas declaradas nos editais 002 e 003 —
    11 cargos, 22 valores — e a regra saiu do dado:

        total = AC + PD + CN          (a base é o TOTAL, não o AC)
        PD    = arredonda(total × 0,10)
        CN    = arredonda(total × 0,20)
        AC    = total − PD − CN

    Arredondamento **COMUM — meio para cima**. Sem piso de uma vaga.

    | cargo | AC | PD | CN | total | 10% | 20% |
    |---|---|---|---|---|---|---|
    | 002 Arte             |   1 |  0 |  0 |   1 |  0,10 → 0 |  0,20 → 0 |
    | 002 Ciências         |   1 |  0 |  0 |   1 |  0,10 → 0 |  0,20 → 0 |
    | 002 Ed. Física       |   5 |  1 |  2 |   8 |  0,80 → 1 |  1,60 → 2 |
    | 002 Geografia        |   3 |  0 |  1 |   4 |  0,40 → 0 |  0,80 → 1 |
    | 002 História         |   1 |  0 |  0 |   1 |  0,10 → 0 |  0,20 → 0 |
    | 002 L. Inglesa       |  10 |  1 |  3 |  14 |  1,40 → 1 |  2,80 → 3 |
    | 002 L. Portuguesa    |   7 |  1 |  2 |  10 |  1,00 → 1 |  2,00 → 2 |
    | 002 Matemática       |  12 |  2 |  3 |  17 |  1,70 → 2 |  3,40 → 3 |
    | 002 Docente II       |   3 |  1 |  1 |   5 |  0,50 → 1 |  1,00 → 1 |
    | 003 Enfermeiro       | 140 | 20 | 40 | 200 | 20,00 → 20 | 40,00 → 40 |
    | 003 Téc. Enfermagem  | 108 | 16 | 31 | 155 | 15,50 → 16 | 31,00 → 31 |

    **O que cada caso DESCARTA — é por isso que 22 valores valem mais que um:**
    · Teto (`ceil`): Arte tem 1 vaga, 10% = 0,1, e o edital declara ZERO. Com ceil seria 1.
    · Piso (`floor`): Ed. Física tem 8, 10% = 0,8, e o edital declara 1.
    · "Meio para o par" (o padrão do IEEE, e o de várias linguagens por omissão): Docente
      II tem 0,5 → 1, e Téc. Enfermagem tem 15,5 → 16. Meio-para-o-par daria 0 no primeiro.
    · Base no AC: Matemática declara PD=2, que é 10% de 17 (total) e não de 12 (AC);
      Téc. Enfermagem declara 16, que é 10% de 155 e não de 108 (daria 11).

    🔴 **Consequência para a UI:** quem preenche digita o **TOTAL de vagas do cargo**, e o
    sistema propõe PD, CN e o AC restante. Não o contrário.

    ⚠️ **O que isto NÃO é:** o texto da lei. É a prática da FEVRE, medida. Os três casos de
    `total × 0,1 < 0,5` viraram zero — ou seja, **cargo pequeno não reserva vaga nenhuma**,
    e é exatamente aí que uma norma poderia exigir piso de 1. Se a Lei 5.309/2017 ou a
    municipal de PCD impuser mínimo, a função muda numa linha e o teste com estes 22
    valores pega a diferença na hora.

    ⚠️ **O Edital 004 ficou fora da amostra**: as vagas dele estão no Quadro II, por UBSF —
    estrutura diferente, que é assunto da fatia 7.

