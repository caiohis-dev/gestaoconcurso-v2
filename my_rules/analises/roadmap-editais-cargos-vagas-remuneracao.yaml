  etapa_0_o_que_ela_achou: |
    🔴 A bateria de cargos estava QUEBRADA há seis semanas, em três pontos em cascata —
    uma escondia a outra. Consertada em 2026-09-16, commit 6f36647:

    1. Três `ON CONFLICT` com a chave natural ANTIGA `(edital_id, cpf, cargo_id,
       n_inscricao)`. Ela virou `(edital_id, n_inscricao)` em 01/08. O caso 7.3 abortava a
       transação e tudo abaixo nem rodava.
    2. Duas chamadas de `trocar_candidatos_do_edital` com 3 argumentos; ela ganhou o 4º
       em 02/08. É o exemplo que o CLAUDE.md §5 usa para descrever o problema.
    3. O caso 7.5 afirmava "mesma inscrição, mesmo CPF, cargo diferente → tem de entrar".
       Hoje o sistema RECUSA, e recusa certo. Era a armadilha 8: o caso afirmava um mundo
       que a decisão de 01/08 mudou.

    🟢 Linha de base agora VERDE: 38 casos, e os únicos ERROR são recusas provocadas de
    propósito. É contra isto que a etapa 3 vai comparar.

