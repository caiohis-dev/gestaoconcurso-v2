  por_que_os_canais_moram_aqui: |
    `edital_canais_atendimento` ATRAVESSA vários capítulos: posto presencial de inscrição
    [6], envelope de isenção [7], envelope de PCD [8], e-mail de impugnação [17], e-mail de
    vista da folha [13].

    Decisão: a tabela nasce NESTA fatia, porque é aqui que o primeiro consumidor aparece
    (o posto presencial). As outras fatias apenas REFERENCIAM o canal, não o recriam.
    ⚠️ Se a fatia 5 (vista de prova) vier antes desta, ela cria o campo `email_solicitacao`
    solto — e aí passam a existir dois lugares guardando e-mail de atendimento. Quem
    executar a 5 primeiro precisa saber disso.

  # ═══════════════════════════════════════════════════════════════════════════
  medido_antes: |
    ⚠️ ESTE BLOCO ESTAVA ERRADO EM DOIS PONTOS, e ele mesmo avisava por quê: "os três
    editais não foram conferidos campo a campo nesta fatia". Fica registrado, corrigido,
    porque é o quinto caso do padrão que o CLAUDE.md §1 descreve.

    ❌ "CadÚnico atualizado nos últimos 24 MESES" — **NÃO EXISTE**. "24 meses" tem ZERO
       ocorrências nos três editais, e nenhum deles exige prazo de atualização do CadÚnico.
       A coluna `meses_atualizacao_cadunico` não foi criada.

    ❌ "Um pedido/envelope POR CARGO" — os três dizem "um envelope por **CANDIDATO**".
       A regra que de fato existe é outra, e está no item 6.10 do 003: "a documentação
       apresentada para o pedido de isenção é válida para apenas um cargo… procedimentos
       independentes… envelopes distintos". ✅ O 003 e o 004 a têm; o **002 NÃO**. É
       parâmetro de verdade, e virou `documentacao_isencao_vale_para_um_cargo`.

    ✅ "Declaração REDOME emitida no ANO CORRENTE" — confirmado, e é o parâmetro que mais
       varia: o 003 e o 004 exigem; o 002 não.

    ✅ 3 doações em 12 meses — IGUAL nos três.

    🔵 E A MEDIÇÃO QUE FALTAVA: os TRÊS editais publicam os critérios de isenção PALAVRA
       POR PALAVRA IGUAIS — CadÚnico (A), doador de sangue ou REDOME (B), serviço eleitoral
       (C). São TRÊS alíneas, não quatro.

