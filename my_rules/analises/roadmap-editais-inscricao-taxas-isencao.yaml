  # ═══════════════════════════════════════════════════════════════════════════
  riscos: |
    R1. 🔴 **Canal de atendimento duplicado.** Se outra fatia criar campo de e-mail antes
        desta, passa a haver dois lugares guardando a mesma informação — e um deles vai
        envelhecer. Ver `por_que_os_canais_moram_aqui`.

    R2. **Taxa recortada errado.** Se for por nível e o edital cobrar por cargo (ou o
        inverso), o capítulo inteiro precisa ser remodelado. É medição, não palpite.

    R3. **Isenção é a porta de fraude mais visada de um concurso.** ⚠️ O sistema aqui só
        DESCREVE a regra no edital; quem defere é a banca. Não deixar o doc sugerir que há
        validação automática.

  # ═══════════════════════════════════════════════════════════════════════════
  r2_respondido: |
    ✅ A TAXA É POR CARGO, e virou COLUNA em `edital_cargos`, não tabela.

    Os 6 valores publicados:

        002  Docente I ........... R$ 100,00      003  Enfermeiro .......... R$ 100,00
        002  Docente II .........  R$  80,00      003  Téc. em Enfermagem .  R$  80,00
        004  Agente Comunitário .  R$  80,00      004  Agente de Endemias .  R$  80,00

    Os três publicam uma LISTA NOMINAL por cargo ("A) Docente I – R$ 100,00").

    ⚠️ Existe correlação perfeita com a escolaridade — 100 para superior, 80 para
    médio/técnico —, inclusive no caso que quase a derruba: o Docente II, cuja habilitação
    mínima é "Curso Normal de Nível MÉDIO". Mesmo assim o recorte NÃO é por escolaridade:
      · o documento publica por cargo, nas 6 linhas;
      · são 6 pontos com 2 valores distintos — correlação observada, não regra declarada;
      · modelar por nível obrigaria o edital a obedecer a uma regra que nunca escreveu, e
        quebraria no dia em que dois cargos superiores tivessem taxas diferentes.

    ➜ A correlação virou SUGESTÃO (botão "sugerir R$ 100") e AVISO (taxas divergentes no
      mesmo nível), no desenho de `sugerirCotas`. O CASO 2 da bateria prova que o banco
      NÃO impõe a correlação.

    🔵 E é COLUNA, não tabela: a relação é 1:1 com `edital_cargos`, que já carrega
      `vencimento_base` e as vagas. Uma `taxas_inscricao` de duas colunas seria uma junção
      a mais para sempre.

  # ═══════════════════════════════════════════════════════════════════════════
  r1_materializou: |
    🔴 O RISCO R1 DEIXOU DE SER RISCO: a fatia 5 veio antes desta e criou
    `regras_vista_prova.email_solicitacao` solto, exatamente como o bloco
    `por_que_os_canais_moram_aqui` previa.

    DECISÃO: a coluna **não foi migrada** para `edital_canais_atendimento`.
      · ela tem CHECK própria (`chk_vista_presencial_tem_email`), que garante e-mail quando
        o rito é presencial — movê-la exigiria converter essa CHECK em trigger;
      · é tabela já entregue, e remodelá-la custa mais do que a duplicação de um campo.

    MITIGAÇÃO: a regra `email-da-vista-fora-dos-canais` acusa quando o e-mail declarado na
    fatia 5 não está entre os canais do edital. A duplicação passa a ser VISÍVEL em vez de
    silenciosa — que era o desfecho que o R1 temia ("um deles vai envelhecer").

    🔴 E AQUI O TEMA FECHA, POR DECISÃO DO USUÁRIO EM 2026-09-17: "não é para recusar a
    divergência, só aviso basta". A alternativa foi apresentada com o custo na mão (FK de
    `regras_vista_prova` para o canal + a CHECK `chk_vista_presencial_tem_email` virando
    trigger + caso de bateria) e RECUSADA.

    ⚠️ NÃO REABRIR como se fosse dívida técnica esquecida. É escolha, e estas são as
    consequências aceitas, escritas para que ninguém as descubra como surpresa:
      · divergência entre os dois e-mails É POSSÍVEL e não impede a publicação;
      · o aviso aparece só na tela do capítulo de inscrição — quem editar apenas o
        capítulo da vista de prova não o vê;
      · por psql, PostgREST ou script, a divergência entra sem nada acusar.

  # ═══════════════════════════════════════════════════════════════════════════
  desvios_da_execucao: |
    🔴 DUAS PREMISSAS DO PRÓPRIO `medido_antes` CAÍRAM (24 meses do CadÚnico; "envelope por
       cargo"). Estão corrigidas lá em cima, não apagadas. É o quinto caso do padrão do §1.

    🔴 E UMA TERCEIRA COLUNA PROPOSTA CAIU, a quarta da v3: `meses_atualizacao_cadunico`.
       Depois de `limite_itens_aceitos` (fatia 6), `numero_inicial`/`numero_final` (fatia 7)
       e `aplica_apenas_sexo` (fatia 8). O padrão é constante: o esboço antecipa uma
       estrutura que o documento real não tem.

    🔴 E O ESBOÇO PROPUNHA QUATRO CRITÉRIOS DE ISENÇÃO. São TRÊS: o item B junta doador de
       sangue e REDOME sob UMA lei municipal e UM requerimento — o 003 chega a escrever "de
       acordo com sua opção (REDOME ou Doador de Sangue)". Separá-los publicaria uma alínea
       que o documento não tem, e daria a mesma `lei_referencia` a dois critérios.

    ➕ O `tipo_canal` VIROU O MEIO, não a finalidade. O esboço propunha
       `EMAIL_IMPUGNACAO | EMAIL_VISTA_PROVA | POSTO_PRESENCIAL | PORTAL_WEB`, misturando as
       duas coisas — e o dado mostra por que não dá: no Edital 002 o MESMO posto da FEVRE
       serve a quatro finalidades (isenção, laudo PCD, autodeclaração, títulos). A
       finalidade foi para `rotulo`, texto livre.
       ⚠️ E o CASO 5b guarda que a repetição é PERMITIDA: o ganho da tabela não é impedir
       que o mesmo endereço apareça duas vezes, é que seja UMA linha referenciada em vez de
       quatro textos digitados à mão.

    ➕ `conferirInscricao` NASCEU COM COMPLEXIDADE 25 e o lint subiu para 112. Extraído em
       três funções (`conferirTaxas`, `conferirCriterios`, `conferirCanais`) e voltou a 111.
       Extrair é a saída deste repo; elevar o baseline não é.

    ⚠️ FRONTEIRA REGISTRADA: nada nesta fatia DEFERE isenção. O capítulo descreve a regra
       que sai no edital; quem analisa o pedido é a banca. É o R3, e está escrito no
       cabeçalho de `edital-inscricao.ts` para que ninguém suponha validação automática.
