    - id: 3
      titulo: "A confirmação destrutiva e o relatório"
      janela: "B"
      status: |
        ✅ CONCLUÍDA em 2026-07-30, no mesmo merge da etapa 2 (as duas são a janela B).

        DECISÃO REGISTRADA (D7): a confirmação NÃO pede senha, ao contrário do "limpar
        edital". Lá a destruição é um clique só partindo de uma listagem; aqui o usuário
        já atravessou três passos deliberados e está olhando o que vai entrar. Senha no
        fim de um assistente de cinco passos vira memória muscular, e memória muscular
        não confere nada. O que protege é o CONTRASTE de números.

        ACRESCENTADO ALÉM DO DESENHO: quando a planilha traz menos da METADE do que o
        edital tem hoje, a confirmação ganha um aviso de arquivo possivelmente
        incompleto. Não bloqueia (pode ser legítimo), mas muda o tom de "confirme" para
        "confira antes". O limiar é arbitrário de propósito.

        O relatório passou a abrir com "A lista NÃO foi alterada" quando a troca não
        acontece — é a informação mais importante do fluxo novo, porque INVERTE o que
        valia antes."
      objetivo: >
        O usuário não pode trocar a lista inteira sem ver o que está trocando.
      acoes:
