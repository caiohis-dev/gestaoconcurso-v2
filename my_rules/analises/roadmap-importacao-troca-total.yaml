  # ═══════════════════════════════════════════════════════════════════════════
  riscos:
    - risco: "🔴 Preparo INCOMPLETO disparar a troca — apaga 7.416 e insere 6.000, e o relatório diz sucesso"
      mitigacao: >
        ✅ FECHADO NO BANCO em 2026-07-30 pela GUARDA 3 (IM003), migration 20260730130000 —
        ver D4. Era o risco nº 1 do desenho e o único que estava sem defesa no banco; a
        conferência saiu do cliente e virou regra. Verificado nos casos 4b (incompleto) e
        4c (duplicado) da bateria.

    - risco: "🔴 Lote vazio ou já consumido apagar a lista sem repor, em silêncio"
      mitigacao: "GUARDA 1 do RPC (IM001), verificada no caso 1 da bateria."

    - risco: "🔴 Arquivo truncado — a troca apaga milhares e insere poucos"
      mitigacao: >
        D7: a confirmação com os dois números. ⚠️ É proteção MAIS FRACA que a da
        alternativa de D0, que sabia dizer quem exatamente sumiria. Aqui o usuário compara
        7.416 com 12 e decide. Registrado como custo aceito da escolha.

    - risco: "Edital errado no preparo — apagar a lista de A e pôr a de B"
      mitigacao: "GUARDA 2 do RPC (IM002), verificada no caso 2."

    - risco: "INSERT falhar no meio e deixar o edital vazio"
      mitigacao: "A função é uma transação: verificado no caso 4, com sabotagem por CHECK e ninguém apagado."

    - risco: "Coluna nova em `candidatos` deixar de ser transportada, em silêncio, no meio de uma troca total"
      mitigacao: "A linha é jsonb e o INSERT usa jsonb_populate_record — mapeamento por nome. Caso 6 da bateria guarda isso."

    - risco: "RC001 barrar a troca depois que ela ligar"
      mitigacao: >
        Não barra — o DELETE roda antes do INSERT na mesma transação, então o trigger não
        acha nada. Ele fica INERTE, e sai na etapa 4 por ser guarda que não dispara.

    - risco: "Duas importações simultâneas no mesmo edital"
      mitigacao: >
        Cada uma tem seu `importacao_id`, então os preparos não se misturam. As trocas
        serializam no banco e a última vence — e, dadas P1 e P2, ambas trazem a lista
        inteira. Não vale um lock AGORA (escopo novo); registrar no módulo.

    - risco: "⚠️ P2 cair — `candidatos` passar a guardar algo que a planilha não sabe"
      mitigacao: >
        Aí a troca total DESTRÓI esse dado a cada importação, e o tema tem de ser reaberto
        ANTES da feature nova. Registrar como pré-condição no contrato do módulo, junto do
        item que já prevê essa evolução ("se um dia for preciso saber em que sala cada
        inscrito faz prova"). Hoje há 0 FKs apontando para `candidatos` — é o que torna
        isto seguro AGORA e o que deixará de valer depois.

    - risco: "Preparo abandonado acumular na tabela"
      mitigacao: >
        A troca consome o lote. Sobra apenas de importação que falhou antes da troca, e a
        etapa 2 limpa o lote no gate. Linha antiga ali é rascunho e pode ser apagada — está
        no COMMENT da tabela.

  # ═══════════════════════════════════════════════════════════════════════════
  criterio_de_pronto: |
    O tema fecha quando, contra o banco local:

      1. corrigir CPF, cargo OU inscrição na planilha e reimportar deixa UMA linha —
         os três campos, não só o cargo;
      2. um bloco sabotado deixa a lista do edital IDÊNTICA, e o relatório diz isso;
      3. a confirmação mostra os dois números antes de qualquer destruição;
      4. outro edital no mesmo banco fica intocado;
      5. suíte verde, `tsc` limpo, `build` limpo, lint no baseline, `db reset` completo.

    ⚠️ Sem CI, isto é rodado à mão. O item do CI segue como o de maior alavancagem do backlog.
