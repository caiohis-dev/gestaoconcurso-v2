        - "Recusar a confirmação não sobe preparo nenhum"
        - "O relatório mostra os números vindos do RPC"
        - "⭐ Gate barrado → o relatório diz que a lista não mudou"
      documentacao:
        - "estrutura/modulos/candidatos/00-modulo.md — a seção do relatório"

