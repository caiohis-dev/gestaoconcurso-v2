        - "✅ CASO 4b — ⭐ preparo INCOMPLETO (2 de 3) recusado com IM003 e a lista sobreviveu"
        - "✅ CASO 4c — preparo DUPLICADO (2 de 1) recusado com IM003"
        - "✅ CASO 4d — total esperado ZERO recusado com IM001 (esvaziar tem tela própria)"
