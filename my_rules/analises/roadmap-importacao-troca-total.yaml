    - id: 2
      titulo: "O cliente sobe o preparo e dispara a troca"
      janela: "B"
      status: |
        ✅ CONCLUÍDA em 2026-07-30. `useImportarCandidatos` foi reescrito: gera UM
        `importacao_id`, sobe os blocos para `candidatos_importacao` e chama a RPC.
        `TAMANHO_BLOCO` passou de 500 para 1.000 (D4b) — a etapa em que isso era seguro,
        porque o destino do bloco mudou de qualquer jeito.
        `ResultadoBloco[]` deu lugar a `ResultadoImportacao`, que carrega o campo que
        importa: `trocou`. O laço de envio saiu para `subirPreparo()` — a `mutationFn`
        tinha estourado o limite de complexidade em 2 pontos, e separar "envia" de
        "decide se troca" é o que impede um return de virar autorização para apagar.

        ⚠️ LIMPEZA FEITA JUNTO, e é dívida que eu mesmo criei de manhã: quatro ramos de
        `mensagemErroImportacao` (chk_candidato_cpf_formato, _cep_, _email_, _raca_valida)
        viraram CÓDIGO MORTO quando a migration 20260730100000 dropou aquelas CHECKs.
        Guarda que não pode disparar faz o próximo leitor acreditar que a regra existe."
      objetivo: >
        A importação passa a ser troca total de fato. É a etapa que muda comportamento.
      acoes:
        - acao: "`useImportarCandidatos` passa a alimentar o preparo"
          detalhe: |
            - Gerar UM `importacao_id` no início da mutation. ⚠️ Um por importação, não
              por bloco: é o recorte que o RPC consome.
            - Os blocos de 500 passam a fazer `insert` em `candidatos_importacao`, cada
              linha como `{ importacao_id, edital_id, linha: <o candidato>, created_by }`.
            - ⚠️ Limpar o preparo daquele lote ANTES de começar, para o caso de uma
              tentativa anterior ter deixado resto — senão a segunda tentativa envia o
              dobro e a duplicata derruba a troca no índice único.
        - acao: "O gate de D4 e a chamada ao RPC"
          detalhe: |
            - Só chamar `trocar_candidatos_do_edital` se TODO bloco entrou sem erro E
              `deveParar()` nunca foi acionado E o total preparado bate com o do lote.
            - Se o gate não passar: NÃO chamar, apagar o preparo do lote, e informar ao
              relatório que a lista NÃO foi alterada.
            - Traduzir IM001 e IM002 em `mensagemErroImportacao`, no padrão que já existe
              para os erros do Postgres.
          nao_faca: |
            - NÃO mexer em TAMANHO_BLOCO, no laço, nem em `deveParar`.
            - NÃO reaproveitar `excluirDoEdital` — ver `fora_de_escopo`.
            - NÃO chamar o RPC "otimisticamente" e tratar o erro depois: a GUARDA 1 do
              banco existe como último recurso, não como fluxo normal.
      testes:
        - "O preparo recebe as linhas com o mesmo `importacao_id` em todos os blocos"
        - "⭐ Bloco falho → o RPC NÃO é chamado e o preparo é limpo (o teste que guarda D4)"
        - "⭐ `deveParar` acionado → idem"
        - "Todos os blocos ok → o RPC é chamado UMA vez, com edital e lote corretos"
        - "IM001 e IM002 viram mensagem legível"
      verificacao:
        - "Contra o banco local, com o arquivo real: 7.416 sobem ao preparo e a troca devolve (0, 7.416) na primeira vez"
        - "⭐ Corrigir um CPF na planilha e reimportar: 7.416 → 7.416, e a linha antiga NÃO sobra (é o defeito que abriu o tema)"
        - "⭐ Sabotar um bloco: a lista do edital fica IDÊNTICA e o preparo não sobra"
      documentacao:
