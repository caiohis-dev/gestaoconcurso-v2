  # ═══════════════════════════════════════════════════════════════════════════
  riscos: |
    R1. 🔴 **Se a tela deixar de espelhar o banco, o erro muda de tamanho.** Hoje uma
        inscrição longa é uma linha acusada no relatório; se a guarda da tela e a CHECK
        divergirem, vira a **troca do edital inteiro derrubada** dentro da RPC. Os dois
        números têm de mudar juntos, e a etapa 3 tem caso para os dois lados.

    R2. **A tradução por texto envelhece; por nome, não.** A de hoje prova isso: ela casa
        `value too long` e cita "8". Trocar por nome de CHECK é o conserto — mas cria
        dependência do NOME, que passa a não poder ser renomeado sem tocar a tradução.

    R3. ⚠️ **Esta migration entra na fila do bootstrap de produção.** Ela será a 122ª e
        sobe no mesmo `prod:push` do
        [`roadmap-bootstrap-banco-producao.yaml`](./concluidos/roadmap-bootstrap-banco-producao.yaml).
        Como a base nova nasce sem candidatos, não há ordem a respeitar entre os dois temas.

    R4. **`n_inscricao` continua aceitando não-dígito** (DC). Se alguém auditar esperando
        "12 dígitos" e encontrar `N001`, vai achar que a regra falhou. Por isso o motivo
        está no `COMMENT ON COLUMN` e no `00-modulo.md`, não só aqui.
