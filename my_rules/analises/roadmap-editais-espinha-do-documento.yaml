    - id: 4
      nome: "Verificação e docs"
      status: "⏳ pendente"
      entrega:
        - >
          `edital-numeracao.test.ts` e `edital-linter.test.ts`: ligar um condicional no meio
          renumera todos abaixo E atualiza as referências.
          ⚠️ FALSIFICAR: fixar a numeração tem de derrubar exatamente os casos de
          renumeração — senão o teste não guarda o que diz guardar (armadilha 8 de testes.md).
        - >
          ⭐ CONTROLE POSITIVO COM DADO REAL: montar o esqueleto do Edital 002/2026 (16
