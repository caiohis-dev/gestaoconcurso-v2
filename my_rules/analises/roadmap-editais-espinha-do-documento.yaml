  # ═══════════════════════════════════════════════════════════════════════════
  riscos: |
    R1. 🔴 **Persistir o número "só para facilitar" mata a fatia inteira.** É a tentação
        óbvia na primeira tela que precisar exibir "Capítulo 7". No dia em que um condicional
        entrar, o documento publica número errado — que é exatamente o defeito de origem.
        A guarda é o teste falsificado da etapa 4.

    R2. **A tela pode ficar rápida demais para a espinha aparecer.** Com capítulos vazios,
        é tentador "adiantar" conteúdo de algum capítulo durante esta fatia. Isso mistura
        escopo e tira a chance de provar a renumeração isolada.

    R3. **`edital_capitulos` nasce sem nenhum consumidor além do Studio.** Se a fatia 2
        demorar, fica uma tabela com 18 linhas por edital e nenhum conteúdo — parecendo
        dívida para quem chegar depois. ⚠️ O 00-modulo.md precisa dizer que é a espinha, e
        que capítulo vazio é estado esperado, não migration pela metade.

    R4. **A rota nova entra na matriz de guards.** `src/pages/guards.test.tsx` cobre
        rota × papel e o `docs:conferir` confere a matriz do doc contra o `App.tsx`.
        Esquecer de declarar o papel NA ROTA é o buraco de autorização que já falhou 3 vezes
        neste repo.

  # ═══════════════════════════════════════════════════════════════════════════
  desvios_da_execucao: |
    Registrados porque quem ler este roadmap depois vai comparar com o código.

    ❌ A RPC `criar_edital_com_capitulos` NÃO FOI CRIADA (a decisão P5 caiu).
       O motivo: se a RPC semeasse os capítulos, ela precisaria conhecer a lista — e o
       catálogo passaria a existir em DOIS lugares, contra a decisão P1. A saída foi
       tornar a linha de `edital_capitulos` um OVERRIDE: capítulo sem linha vale pelo
       padrão do catálogo, e a linha nasce por UPSERT quando alguém desliga, reordena ou
       escreve. Some a semeadura, some a transação de vários passos, some o estado pela
       metade — e P5 deixa de ter objeto.
       🔵 Efeito bom não previsto: os 3 editais de produção ganharam estrutura de
       documento SEM backfill, e capítulo novo no catálogo vale para todos sem migration.

    ➕ O CATÁLOGO TEM 19 ELEMENTOS, 17 NUMERADOS — não 18, como este roadmap dizia.
       Medido no material: `[0]` preâmbulo e `[18]` anexos não recebem número. A conta
       fecha nos três editais (17−1=16, 17−2=15, 17−1=16), o que o número errado escondia.

    ➕ CAPÍTULO GANHOU TEXTO NESTA FATIA (decisão do usuário, 2026-09-16). O roadmap
       previa capítulos vazios; com a coluna `texto`, a fatia 1 já entrega um editor
       utilizável e o linter de "capítulo vazio" passa a ter o que verificar.

    ➕ TODO CAPÍTULO É DESLIGÁVEL (decisão do usuário), não só os dois condicionais. O
       catálogo define o padrão; desligar um capítulo padrão gera AVISO do linter.

    🔴 ACHADO na bateria: o caso da FK RESTRICT passava pelo MOTIVO ERRADO. Com um edital
       existente, quem barrava o DELETE era `provas_edital_id_fkey` — a FK nova não era
       exercitada e o caso dizia OK. É a armadilha do CLAUDE.md §8 (regra nova ofuscada
       pela antiga). Corrigido: o caso cria um edital limpo e exige o NOME exato da
       constraint.

    🔴 ACHADO no lint: o `EditalStudio` nasceu com complexidade 19 (teto 15), subindo a
       baseline de 111 para 112. Em vez de subir o número, os painéis viraram componentes
       (`Trilha`, `PreviewELinter`) — o que o próprio desenho das "três projeções" já
       pedia. Baseline de volta a 111.
