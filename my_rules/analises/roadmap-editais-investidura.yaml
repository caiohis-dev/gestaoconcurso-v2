  # ═══════════════════════════════════════════════════════════════════════════
  riscos: |
    R1. 🔴 **Testar só o caso feliz.** O teste que interessa é o negativo — e é o que se
        esquece, porque "num edital de ACS ninguém vai marcar COREN" parece óbvio. Foi
        exatamente o que aconteceu no 004.

    R2. **Desabilitar em vez de não oferecer.** Campo desabilitado vira campo habilitado no
        dia em que alguém "melhorar" a UX.

    R3. **Se a fatia 2 não tiver populado `conselho_classe_obrigatorio`**, a regra não tem
        sobre o que decidir e degrada em silêncio para "oferece tudo". ⚠️ O linter precisa
        acusar cargo sem conselho definido, em vez de assumir NENHUM.

  # ═══════════════════════════════════════════════════════════════════════════
  medido_na_execucao: |
    🔴 DE ONDE VEIO O ERRO DO COREN — e a medição fecha o diagnóstico. O Edital 003
    (Enfermagem) tem DOIS documentos de conselho:

        K) Registro Ativo e regular com anuidade paga no COREN
        N) Certidão Nada Consta do COREN (Certidão Única Atualizada)

    O Edital 004 herdou SÓ O SEGUNDO, com o mesmo texto entre parênteses. Não é erro
    sistemático de geração: é uma linha copiada à mão de um documento para o outro.

    NÚCLEO COMUM AOS TRÊS (10 documentos): comprovante de votação · identificação com foto
    · comprovante de residência (3 meses) · CPF · PIS/PASEP · certidão de nascimento ou
    casamento · certidão de nascimento de filhos menores de 14 anos · foto 3x4 ·
    certificado de reservista (homem) · declaração de IR, caso declare.

    ⚠️ O QUE NÃO ENTROU no pré-preenchimento, e por quê:
      · ASO — é documento só no 002; nos outros dois está na frase de abertura
        ("julgado APTO no exame médico admissional");
      · DIPLOMA — é por cargo, e os três o escrevem diferente: "do Curso exigido para o
        cargo a que concorre" (002), um por cargo (003), "do Ensino Médio" (004).
      Pré-marcar qualquer um seria pôr na boca do edital o que ele não diz.

    ⚠️ E a quantidade de fotos varia: o 002 pede uma, o 003 e o 004 pedem duas.

  # ═══════════════════════════════════════════════════════════════════════════
  a_divida_da_fatia_2_que_esta_fatia_pagou: |
    🔴 `cargos.conselho_classe_obrigatorio` ERA COLUNA ÓRFÃ, e o R3 estava certo em
    desconfiar — mas o problema era pior do que ele previa.

    O R3 supunha que a coluna poderia estar NÃO POPULADA. Medido: além de vazia (0 cargos
    no banco), ela **não era lida nem escrita por nenhum código**. O único lugar que a
    mencionava era um comentário no cabeçalho do `QuadroDeCargos.tsx` afirmando que "a
    trava de conselho de classe é o primeiro anteparo ao erro do Edital 004" — e não havia
    trava nenhuma. É o padrão do §8 do CLAUDE.md: o NOME (aqui, o comentário) mente antes
    do código.

    ➜ Esta fatia pagou a dívida: `escolaridade_minima` e `conselho_classe_obrigatorio`
      ganharam campo no `CargoDialog`, entraram no SELECT e na interface `Cargo`, e
      `atualizarCargo` passou a aceitá-los.

    ⚠️ A distinção de três estados é o que faz a regra funcionar, e ela já estava no
    domínio do banco desde 16/09 — só não tinha quem a usasse:

        null       não declarado  → o linter ACUSA
        'NENHUM'   declarado, não exige  → silêncio, é resposta válida
        'COREN'    exige  → o documento do conselho passa a ser oferecido

    🔴 `criarCargo` NÃO mudou de assinatura, e é decisão: a importação de candidatos o
    chama com só o nome, em lote, e não tem esses dados. A tela de cargos faz dois passos
    na criação, e só quando há algo a declarar. Se o segundo falhar, o cargo existe sem a
    declaração — estado incompleto e VISÍVEL (o linter acusa), não perda silenciosa.

  # ═══════════════════════════════════════════════════════════════════════════
  a_defesa_em_duas_camadas: |
    | | onde | o que alcança |
    |---|---|---|
    | 1 | trigger `IN001` | `conselho_exigido` que nenhum cargo do edital exige — exato, e vale por psql, PostgREST e script |
    | 2 | `conferirInvestidura` | a sigla escrita no TEXTO LIVRE, que o trigger não vê |

    🔴 A camada 2 é heurística DE PROPÓSITO. Nome de documento varia demais ("COREN",
    "Coren-RJ", "Conselho Regional de Enfermagem") para virar barreira de banco sem recusar
    o legítimo. Ela ACUSA; quem IMPEDE é a camada 1. O CASO 3e da bateria prova que o banco
    aceita o texto livre, para que ninguém tome a brecha por descuido.

    ⚠️ E a regra vale PARA O ADMIN também (CASO 8b): o trigger é `SECURITY INVOKER` e roda
    depois da RLS. Papel não é salvo-conduto para publicar um edital incoerente.

  # ═══════════════════════════════════════════════════════════════════════════
  desvios_da_execucao: |
    🔴 UM TESTE MEU PASSOU VERDE SEM GUARDAR NADA, e a falsificação o pegou. O caso "CRM
    não casa dentro de CRMV" dizia guardar a FRONTEIRA DE PALAVRA da sigla — e não
    guardava: a ordenação por tamanho (siglas maiores primeiro) já resolvia CRMV/CRM
    sozinha, então trocar a regex por `includes` mantinha os 18 casos verdes. Entrou um
    caso que exercita de verdade: "MICROEMPREENDEDOR" contém "CRO", e sem a fronteira um
    checklist que peça declaração de MEI seria acusado de exigir registro no conselho de
    odontologia. Armadilha 8 na forma mais pura — teste verde afirmando uma proteção.

    ➕ E O MESMO DEFEITO DE SUBSTRING apareceu noutro teste meu, na mesma sessão: a
    asserção "o padrão não inclui ASO" falhava porque "ASO" casa dentro de "caso declare".
    Duas ocorrências do mesmo engano em arquivos diferentes — vale como padrão a vigiar,
    não como acidente.

    🔴 O CASO 6 DA BATERIA NÃO EXERCITAVA O QUE DIZIA. Ele afirmava que conselho fora do
    domínio era barrado por `chk_doc_inv_conselho`; quem barra é o TRIGGER, que é BEFORE e
    roda antes das CHECKs. É o §8 de novo: regra nova ofusca regra antiga.
    ⚠️ A consequência vale registrar: `chk_doc_inv_conselho` é quase inalcançável — para
    chegar nela o valor precisa passar pelo trigger, isto é, algum cargo tem de declará-lo,
    e `cargos` só admite o mesmo domínio mais 'NENHUM'. O ÚNICO valor que a exercita é
    'NENHUM' (CASO 6b). Ela não é redundante: é ela que segura exatamente esse caso.

    🔴 O CASO 10 TAMBÉM NÃO. Usava o Enfermeiro, que está em `edital_cargos`, então a
    recusa vinha de `edital_cargos_cargo_id_fkey` — passava "verde" sem tocar na FK deste
    módulo. Passou a criar um cargo solto. Mesmo defeito que a bateria de capítulos teve.

    ➕ O TRIGGER COBRE UPDATE, não só INSERT (CASO 3b). Validar só o INSERT deixaria o
    caminho óbvio aberto: inserir com a coluna nula e preenchê-la depois.
