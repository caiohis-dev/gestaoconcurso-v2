  # ═══════════════════════════════════════════════════════════════════════════
  por_que_esta_fatia_importa: |
    🎯 É AQUI QUE O PRIMEIRO DEFEITO DO EDITAL 004 MORRE.

    O item 15.8, alínea L, do Edital 004 JÁ PUBLICADO exige "Certidão Nada Consta do COREN"
    para Agente Comunitário de Saúde — cargo de nível médio, sem conselho de classe. É
    resíduo de copia-e-cola do edital de Enfermagem (003).

    A REGRA QUE IMPEDE: o checklist só oferece documento de conselho de classe quando ALGUM
    CARGO DO EDITAL exige aquele conselho (`cargos.conselho_classe_obrigatorio`, fatia 2).
    Num edital só de ACS, o COREN não tem como entrar — não por disciplina de quem redige,
    mas porque a opção não existe ali.

    ⚠️ A diferença é essa: o material de referência propõe "os documentos do COREN ficam
    desabilitados ou ocultos". Desabilitado ainda é oferecido. A regra certa é NÃO EXISTIR.

  # ═══════════════════════════════════════════════════════════════════════════
  p1_respondida: |
    ✅ DECIDIDO em 2026-09-17: **NÃO CRIAR `aplica_apenas_sexo`**, nem a versão genérica.

    Medido nos três checklists: o reservista é de fato o ÚNICO item condicionado a sexo.
    Mas ele NÃO é o único condicional — a mesma lista tem "Certidão de Nascimento de
    filhos menores de 14 anos" e "declaração de Imposto de Renda, caso declare". E os três
    editais exprimem TODAS as condições do mesmo jeito: dentro do texto do documento.

        J) Certificado de Reservista (homem). (original e fotocópia)
        G) Certidão de Nascimento de filhos menores de 14 anos
        K) Cópia (…) da última declaração de Imposto de Renda, caso declare

    Uma coluna de sexo serviria a 1 linha de ~12 e deixaria as outras duas em texto — ou
    seja, dois mecanismos para a mesma coisa. E a "condição de aplicabilidade genérica" que
    o esboço aventava é generalidade que ninguém pediu, pelo próprio critério do esboço.

    ➜ É a TERCEIRA coluna proposta que a medição derruba nesta v3, depois de
      `limite_itens_aceitos` (fatia 6) e `numero_inicial`/`numero_final` (fatia 7). O
      padrão é o mesmo: o esboço antecipa uma estrutura que o documento real não tem.

  # ═══════════════════════════════════════════════════════════════════════════
