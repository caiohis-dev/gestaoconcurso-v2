  # ═══════════════════════════════════════════════════════════════════════════
  riscos: |
    R1. 🔴 **Desempate é a parte do edital que vira processo judicial.** Critério ambíguo ou
        ordem mal descrita é vício recorrente. ⚠️ O sistema DESCREVE o critério; quem aplica
        é a correção. Não deixar o doc sugerir que o sistema desempata.

    R2. **Acoplamento à fatia 5.** Sem disciplina identificável, o critério 3 é texto solto.

    R3. **A hora/minuto/segundo da certidão de nascimento** (critério 4) é dado que o sistema
        não tem e provavelmente nunca terá. É regra textual do edital — registrar como tal,
        para ninguém tentar modelar um campo que não se preenche.

  # ═══════════════════════════════════════════════════════════════════════════
  medido_na_execucao: |
    AS TRÊS ORDENS PUBLICADAS, e elas DIFEREM de verdade:

                        002 (Docente I e II)   003 (Enf. e Téc.)     004 (ACS e ACE)
      1º   Conhecimentos Específicos   Conhecimentos Específicos   Conh. Específicos
      2º   Conhecimentos Pedagógicos   Legislação do SUS           Língua Portuguesa
      3º   Língua Portuguesa           Língua Portuguesa           Matemática
      4º   Prova de Títulos            Maior Idade                 Maior Idade
      5º   Maior Idade                 —                           —

    ⚠️ É isso que faz o controle positivo valer: se as três fossem iguais, reproduzi-las
    não provaria que o modelo cabe em mais de um formato.

    E ANTES da lista, os três têm as MESMAS duas preferências legais (itens 14.2/14.3 no
    002 e no 004; 13.2/13.4 no 003): idade ≥ 60 anos (Lei 10.741/2003, art. 27 § único) e
    exercício da função de jurado (CPP, art. 440).

    E DEPOIS, a lista de PCD, IDÊNTICA nos três (Leis Municipais 3.113/94 e 3.221/95):
    arrimo de família · mais dependentes até 21 anos · nenhuma fonte de renda.

    🔴 A LISTA É POR EDITAL, não por cargo. Os três escrevem "Candidatos aos cargos de
    <A> e <B>" — uma lista cobrindo todos os cargos. ⚠️ Mas a numeração do documento
    (14.5.**1**) antecipa um 14.5.2, então `cargo_id` anulável entrou pelo padrão já
    estabelecido nas fatias 8 e 10: nos três editais reais é uma linha com nulo.

  # ═══════════════════════════════════════════════════════════════════════════
  desvios_da_execucao: |
    🔴 UMA TABELA, NÃO DUAS. O esboço propunha `criterios_desempate` e
       `criterios_desempate_pcd`. São a mesma coisa — uma lista ordenada de critérios de um
       edital —, e duas tabelas duplicariam RLS, índices, a regra de ordem e a tela. A
       única diferença real é QUAIS tipos cada lista admite, e isso uma CHECK expressa
       melhor que um nome de tabela.
       ⚠️ E o item 14.8 do Edital 002 mostra que as duas se encadeiam: "esgotados os
       critérios estabelecidos para as pessoas com deficiência, serão adotados os mesmos
       critérios para os candidatos à ampla concorrência". São dois trechos de um mesmo
       procedimento, não dois assuntos.

    🔴 R3 ATENDIDO: A HORA DE NASCIMENTO NÃO FOI MODELADA. Os três têm a mesma regra de
       último recurso — quem não apresentar a certidão "terá considerada como hora de
       nascimento, 23 horas 59 minutos e 59 segundos". Não virou coluna porque:
         · o dado (a hora de nascimento do candidato) o sistema não tem e não vai ter;
         · e o parâmetro (as 23:59:59) é IDÊNTICO nos três — coluna que ninguém varia é
           coluna em que alguém confia sem motivo.
       Fica como artigo do capítulo, escrito à mão. É o que o R3 pedia: "registrar como
       regra textual, para ninguém tentar modelar um campo que não se preenche".

    ➕ UMA REGRA QUE O BANCO NÃO ALCANÇA E O LINTER PEGA: a ORDEM COM BURACO. O índice
       único impede duas na mesma posição; não impede 1º, 2º, 4º. Um degrau na ordem
       publicada faz quem lê supor que um critério foi omitido.

    ➕ E OUTRA, que cruza fatias: desempate por títulos num edital SEM prova de títulos.
       Só o 002 tem os dois; um sem o outro é um capítulo contradizendo outro.

    ⚠️ `mover` FAZ A TROCA EM TRÊS PASSOS, com uma posição temporária alta. Trocar A(1)↔B(2)
       direto falharia no índice único: ao gravar A=2, B ainda está em 2. NÃO virou RPC, e
       é escolha — a lista tem 4 a 7 itens, a troca é entre DOIS vizinhos, e uma falha no
       meio deixa um critério na posição 9999, visível na tela. Na fatia 1 eram 300 artigos
       e a reescrita era da lista inteira, o que justificava a transação.

    ⚠️ E A FRONTEIRA DO R1 ESTÁ NA TELA, não só no código: "o sistema não compara
       candidatos — quem aplica os critérios é a correção da prova". Desempate é a parte do
       edital que mais vira processo, e quem lê a tela precisa saber que ela só descreve.
