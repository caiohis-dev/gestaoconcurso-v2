  # ═══════════════════════════════════════════════════════════════════════════
  medido_antes: |
    A ordem sucessiva descrita no material, a CONFERIR nos três editais antes de cravar:

      1. Idade igual ou superior a 60 anos (Estatuto do Idoso)
      2. Exercício comprovado da função de jurado (Art. 440 do CPP)
      3. Maior pontuação por disciplina — e a ORDEM das disciplinas varia por edital
         (comum: Específicos > Pedagógicos/Legislação SUS > Português > Matemática/Títulos)
      4. Maior idade cronológica, com desempate por HORA, MINUTO E SEGUNDO da certidão
      5. Critérios próprios de PCD (Lei Municipal 3.113/94): arrimo de família, maior número
         de dependentes até 21 anos, ausência de fonte de renda

    🔴 O item 3 é o que amarra esta fatia à 5: o critério aponta para uma DISCIPLINA, e a
    ordem entre disciplinas é parte do critério. Guardar isso como texto livre torna o
    desempate impossível de verificar.

  # ═══════════════════════════════════════════════════════════════════════════
