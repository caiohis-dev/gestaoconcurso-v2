  riscos: |
    R1. 🔴 **Sem resolver P1, o prazo recursal sai errado e ninguém percebe** — o número
        parece plausível. É o formato de defeito que este repo mais teme.

    R2. **Precedência travando demais** faz quem redige preencher datas falsas para avançar,
        e aí o sistema tem dado errado com aparência de validado.

    R3. **O cronograma é referenciado de dentro de outros capítulos** ("até a data prevista
        no Anexo…"). Essa referência tem de ser por chave de etapa, não por data copiada —
        mesmo raciocínio da referência cruzada de capítulo (fatia 1, P3).
        🔵 2026-09-16: o mecanismo já existe e é por ÂNCORA DE ITEM (`{{item:ancora}}`,
        `src/lib/edital-itens.ts`), entregue na fatia 1. Não inventar um terceiro.

  # ═══════════════════════════════════════════════════════════════════════════
  desvios_da_execucao: |
    ➕ 🔴 UMA TERCEIRA FORMA DE DATA, que o roadmap não previa. Ele propunha
       `data_inicio` + `data_fim`. O cronograma real do Edital 003 tem TRÊS formas:
       data única, intervalo ("29/06 a 27/07") e ALTERNATIVAS ("06/07, 09/07, 13/07,
       16/07 ou 20/07"). Espremer as alternativas num intervalo publicaria um edital
       FALSO — o candidato leria 15 dias onde só 5 são oferecidos. Modelado como
       `tipo` + `datas date[]`, com CHECK de cardinalidade.
       🔵 Efeito colateral bom: as "datas de perícia disponíveis" da fatia 4 são
       exatamente uma etapa ALTERNATIVAS. A fatia 4 reaproveita, não recria.

    🔴 O CRONOGRAMA REAL PEGOU DOIS DEFEITOS MEUS, e nenhum teste inventado pegaria:
       1. A exceção de fim de semana olhava a ETAPA chamada "prova". Mas o gabarito é
          divulgado no MESMO domingo do exame, e a regra acusava. O critério certo é a
          DATA da prova.
       2. A precedência comparava sempre "fim de A × início de B". Com isso acusava que a
          isenção (08/07) vem depois do início das inscrições (29/06) — quando a regra é
          "até o FIM delas" (27/07). Cada regra passou a declarar qual ponta comparar.
       ⚠️ A lição: inventar erro em edital VÁLIDO é o jeito mais rápido de ensinar alguém
       a ignorar o painel de avisos. Pior que não acusar.

    ⚠️ ARMADILHA DE FUSO evitada: `new Date("2026-09-20").getDay()` é UTC e devolveria
       sábado no Brasil. O dia da semana é calculado sobre os números do calendário.

    ⚠️ A UI do cronograma foi pendurada no capítulo `anexos`, porque é lá que o cronograma
       sai no documento (elemento pós-textual). Se um dia virar capítulo próprio, é uma
       entrada no catálogo — não mexe nesta fatia.
